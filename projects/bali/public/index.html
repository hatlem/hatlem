<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali 2026 — Reiseplanlegger</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--a1:#38bdf8;--a2:#818cf8;--a3:#f472b6;--a4:#34d399;--a5:#fbbf24;--tx:#f1f5f9;--dim:#94a3b8;--brd:#334155;--red:#ef4444}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:var(--a1);text-decoration:none}

/* Top bar */
.topbar{background:rgba(15,23,42,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);padding:0.5rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2000;flex-wrap:wrap;gap:0.5rem}
.topbar h1{font-size:1.1rem;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tbtn{background:var(--card);border:1px solid var(--brd);color:var(--tx);font-family:inherit;font-size:0.75rem;padding:0.35rem 0.7rem;border-radius:6px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.tbtn:hover{border-color:var(--a1);background:var(--card2)}
.tbtn.primary{background:var(--a4);color:var(--bg);border-color:var(--a4);font-weight:600}
.tbtn.primary:hover{opacity:0.9}

/* Nav */
.nav{display:flex;gap:0.2rem;padding:0.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--brd);flex-wrap:wrap;position:sticky;top:42px;z-index:1999}
.nav button{background:transparent;border:1px solid transparent;color:var(--dim);font-family:inherit;font-size:0.8rem;font-weight:500;padding:0.4rem 1rem;border-radius:7px;cursor:pointer;transition:all 0.2s}
.nav button:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav button.on{background:var(--a1);color:var(--bg)}

/* Layout */
.main{display:flex;min-height:calc(100vh - 90px)}
.content{flex:1;padding:1.5rem;max-width:900px;overflow-y:auto}
.sidebar{width:400px;min-width:340px;border-left:1px solid var(--brd);position:sticky;top:90px;height:calc(100vh - 90px);display:flex;flex-direction:column}
#map{flex:1;min-height:300px}
.sidebar-info{padding:0.75rem;background:var(--card);border-top:1px solid var(--brd);font-size:0.82rem;color:var(--dim);max-height:180px;overflow-y:auto}
.sidebar-info h4{color:var(--tx);margin-bottom:0.3rem}

.page{display:none}
.page.on{display:block}
.page h2{font-size:1.5rem;font-weight:700;margin-bottom:0.2rem}
.page .desc{color:var(--dim);font-size:0.85rem;margin-bottom:1.25rem}

/* Editable field */
.ef{background:transparent;border:1px solid transparent;border-radius:4px;color:inherit;font:inherit;padding:1px 4px;transition:all 0.15s;cursor:text;min-width:30px}
.ef:hover{border-color:var(--brd);background:rgba(255,255,255,0.03)}
.ef:focus{outline:none;border-color:var(--a1);background:rgba(56,189,248,0.06)}
.ef-price{color:var(--a4);font-weight:600}
.ef-sm{font-size:0.82rem}

/* Cards */
.icard{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-bottom:0.75rem;transition:all 0.2s;cursor:pointer;position:relative}
.icard:hover{border-color:var(--a1);background:var(--card2)}
.icard.active{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1)}
.icard .dates{font-size:0.72rem;color:var(--a1);font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
.icard h3{font-size:1rem;margin:0.15rem 0}
.icard p{color:var(--dim);font-size:0.82rem}
.badge{display:inline-block;font-size:0.6rem;padding:0.12rem 0.45rem;border-radius:8px;font-weight:600;margin-left:0.4rem;vertical-align:middle}
.b-booked{background:rgba(251,191,36,0.2);color:var(--a5)}
.b-open{background:rgba(244,114,182,0.2);color:var(--a3)}
.b-considering{background:rgba(129,140,248,0.2);color:var(--a2)}
.tag{display:inline-block;font-size:0.65rem;padding:0.12rem 0.45rem;border-radius:14px;margin-top:0.3rem;margin-right:0.2rem;font-weight:500}
.t-s{background:rgba(56,189,248,0.15);color:var(--a1)}
.t-k{background:rgba(129,140,248,0.15);color:var(--a2)}
.t-n{background:rgba(52,211,153,0.15);color:var(--a4)}
.t-b{background:rgba(244,114,182,0.15);color:var(--a3)}

/* Hotel comparison */
.price-tbl{width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:0.5rem}
.price-tbl td{padding:0.25rem 0.4rem;border-bottom:1px solid rgba(255,255,255,0.04)}
.price-tbl .best-price{color:var(--a4);font-weight:700}
.price-tbl .src{color:var(--dim);font-size:0.72rem}
.goog-btn{display:inline-flex;align-items:center;gap:0.3rem;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25);color:var(--a1);font-family:inherit;font-size:0.72rem;padding:0.3rem 0.65rem;border-radius:6px;cursor:pointer;transition:all 0.2s;text-decoration:none}
.goog-btn:hover{background:rgba(56,189,248,0.18);border-color:var(--a1)}
.h-status{display:inline-block;font-size:0.6rem;padding:0.12rem 0.45rem;border-radius:8px;font-weight:600;margin-left:0.3rem}
.hs-fav{background:rgba(251,191,36,0.2);color:var(--a5)}
.hs-book{background:rgba(52,211,153,0.2);color:var(--a4)}
.hs-cons{background:rgba(129,140,248,0.2);color:var(--a2)}
.hs-rej{background:rgba(239,68,68,0.15);color:var(--red)}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:0.82rem;margin-bottom:1.25rem;background:var(--card);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.cmp-tbl th{text-align:left;padding:0.6rem 0.75rem;border-bottom:2px solid var(--brd);color:var(--dim);font-weight:500;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em}
.cmp-tbl td{padding:0.55rem 0.75rem;border-bottom:1px solid var(--brd)}
.cmp-tbl tr:hover td{background:rgba(255,255,255,0.02)}
.cmp-tbl .best-row td{background:rgba(52,211,153,0.04)}
.dates-row{display:flex;gap:0.5rem;align-items:center;margin-top:0.4rem;font-size:0.78rem;color:var(--dim);flex-wrap:wrap}
.dates-row input[type="date"]{background:var(--card);border:1px solid var(--brd);color:var(--tx);font-family:inherit;font-size:0.78rem;padding:0.2rem 0.4rem;border-radius:4px}
.dates-row input[type="date"]:focus{border-color:var(--a1);outline:none}
.add-price-btn{background:transparent;border:1px dashed var(--brd);color:var(--dim);font-family:inherit;font-size:0.72rem;padding:0.25rem 0.5rem;border-radius:4px;cursor:pointer}
.add-price-btn:hover{border-color:var(--a1);color:var(--a1)}

/* Map pin icon on card */
.map-pin{position:absolute;top:0.75rem;right:0.75rem;font-size:1rem;opacity:0.4;transition:opacity 0.2s}
.icard:hover .map-pin,.icard.active .map-pin{opacity:1}

/* Delete btn on card */
.del-btn{position:absolute;top:0.75rem;right:2.2rem;font-size:0.85rem;opacity:0;cursor:pointer;transition:opacity 0.2s;color:var(--red)}
.icard:hover .del-btn{opacity:0.6}
.del-btn:hover{opacity:1!important}

/* Add button */
.add-btn{background:transparent;border:2px dashed var(--brd);border-radius:12px;padding:0.75rem;text-align:center;color:var(--dim);font-family:inherit;font-size:0.85rem;cursor:pointer;width:100%;transition:all 0.2s;margin-bottom:0.75rem}
.add-btn:hover{border-color:var(--a1);color:var(--a1)}

/* Budget table */
.btable{width:100%;border-collapse:collapse;font-size:0.85rem}
.btable td{padding:0.5rem 0.4rem;border-bottom:1px solid var(--brd)}
.btable .total td{border-top:2px solid var(--a1);font-weight:700;font-size:1rem;padding-top:0.75rem}
.btable .total .amt{color:var(--a3);font-size:1.15rem}

/* Pack */
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0.75rem}
.pack-cat{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem}
.pack-cat h3{font-size:0.9rem;margin-bottom:0.5rem}
.pack-cat ul{list-style:none}
.pack-cat li{display:flex;align-items:center;gap:0.4rem;padding:0.25rem 0;font-size:0.82rem;color:var(--dim);cursor:pointer}
.pack-cat li:hover{color:var(--tx)}
.ck{width:16px;height:16px;border:2px solid var(--brd);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
li.done .ck{background:var(--a4);border-color:var(--a4)}
li.done .ck::after{content:'\2713';color:var(--bg);font-size:0.65rem;font-weight:700}
li.done{text-decoration:line-through;opacity:0.45}

/* Notes */
.notes{width:100%;min-height:200px;background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:0.75rem;color:var(--tx);font-family:inherit;font-size:0.88rem;resize:vertical}
.notes:focus{outline:none;border-color:var(--a1)}

/* Flights */
.flights{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem}
.fl-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:0.75rem 1rem;flex:1;min-width:240px}
.fl-card .lbl{font-size:0.65rem;color:var(--a1);text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

/* Responsive */
@media(max-width:900px){
  .main{flex-direction:column-reverse}
  .sidebar{width:100%;min-width:unset;position:relative;top:auto;height:350px;border-left:none;border-top:1px solid var(--brd)}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Bali 2026</h1>
  <span id="saveStatus" style="font-size:0.7rem;color:var(--a4);opacity:0.7"></span>
</div>

<nav class="nav" id="nav"></nav>

<div class="main">
  <div class="content">
    <div class="page on" id="p-reiserute"></div>
    <div class="page" id="p-hotell"></div>
    <div class="page" id="p-aktiviteter"></div>
    <div class="page" id="p-budsjett"></div>
    <div class="page" id="p-pakkeliste"></div>
    <div class="page" id="p-notater"></div>
  </div>
  <div class="sidebar">
    <div id="map"></div>
    <div class="sidebar-info" id="sidebarInfo">
      <h4>Klikk på et element for å se det på kartet</h4>
      <p>Alle reisestopp, hotell og aktiviteter kan klikkes for å vise plasseringen.</p>
    </div>
  </div>
</div>

<script>
// ===== GLOBALS =====
let DATA = {};
let activeTab = 'reiserute';
let activeMapItem = null;
let map, markers = [], polyline;

// ===== DEFAULT DATA =====
function initEmptyData() {
  DATA = {
    flights: {
      out: { label:'Utreise', route:'', details:'' },
      ret: { label:'Hjemreise', route:'', details:'' }
    },
    stops: [],
    hotels: [],
    activities: [],
    budget: [],
    packing: [],
    notes: ''
  };
}

// ===== STORAGE: Railway Postgres via API =====
// API_BASE auto-detects: if served from Railway, use relative path; if local file, use full Railway URL.
// AFTER DEPLOY: replace YOUR_RAILWAY_DOMAIN below with your actual Railway domain!
const RAILWAY_URL = 'https://bali-production-9a13.up.railway.app';
const API_BASE = (location.protocol === 'file:' || location.hostname === 'localhost' && location.port !== (window._serverPort||'3000'))
  ? RAILWAY_URL + '/bali/api'
  : '/bali/api';

let saveTimer = null;

async function loadFromAPI() {
  try {
    const r = await fetch(API_BASE + '/data', { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const data = await r.json();
      if (data && data.stops) { DATA = data; return true; }
    }
  } catch(e) { console.warn('API load failed:', e.message); }
  return false;
}

function autoSave() {
  clearTimeout(saveTimer);
  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = 'Lagrer...'; el.style.color = 'var(--a5)'; }

  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch(API_BASE + '/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(DATA)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (el) { el.textContent = 'Lagret ✓'; el.style.color = 'var(--a4)'; }
    } catch(e) {
      console.error('Save failed:', e);
      if (el) { el.textContent = 'Feil ved lagring!'; el.style.color = 'var(--red)'; }
    }
  }, 400);
}


// ===== MAP =====
function initMap() {
  map = L.map('map').setView([-8.55, 115.35], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OSM © CARTO', maxZoom:19
  }).addTo(map);
}

function clearMap() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (polyline) { map.removeLayer(polyline); polyline = null; }
}

function drawRoute() {
  clearMap();
  DATA.stops.forEach((s, i) => {
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:28px;height:28px;border-radius:50%;background:${s.color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#0f172a;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);cursor:pointer;">${i+1}</div>`,
      iconSize:[28,28], iconAnchor:[14,14]
    });
    const m = L.marker([s.lat, s.lng], {icon}).addTo(map)
      .bindPopup(`<b>${s.name}</b><br><small>${s.dates}</small>`);
    m.on('click', () => focusOnItem(s.name, s.lat, s.lng, s.desc));
    markers.push(m);
  });
  const coords = DATA.stops.map(s => [s.lat, s.lng]);
  polyline = L.polyline(coords, {color:'#38bdf8', weight:2, opacity:0.4, dashArray:'6,6'}).addTo(map);
  map.fitBounds(polyline.getBounds().pad(0.15));
}

function flyTo(lat, lng, name, detail) {
  map.flyTo([lat, lng], 14, {duration:0.8});
  clearMap();
  const m = L.marker([lat, lng]).addTo(map)
    .bindPopup(`<b>${name}</b>${detail ? '<br><small>'+detail+'</small>' : ''}`).openPopup();
  markers.push(m);
  // Also draw route faintly
  const coords = DATA.stops.map(s => [s.lat, s.lng]);
  polyline = L.polyline(coords, {color:'#38bdf8', weight:1, opacity:0.2, dashArray:'4,4'}).addTo(map);
}

function focusOnItem(name, lat, lng, detail) {
  activeMapItem = name;
  flyTo(lat, lng, name, detail);
  showSidebar(name, detail || '');
  highlightCard(name);
}

function showSidebar(title, text) {
  document.getElementById('sidebarInfo').innerHTML = `<h4>${title}</h4><p>${text}</p>`;
}

function highlightCard(name) {
  document.querySelectorAll('.icard').forEach(c => c.classList.remove('active'));
  const el = document.querySelector(`.icard[data-name="${CSS.escape(name)}"]`);
  if (el) el.classList.add('active');
}

function showFullRoute() {
  activeMapItem = null;
  drawRoute();
  showSidebar('Hele reiseruten', DATA.stops.map((s,i) => `${i+1}. ${s.name}`).join('<br>'));
  document.querySelectorAll('.icard').forEach(c => c.classList.remove('active'));
}

// ===== EDITABLE FIELD =====
function ef(value, onChange, cls) {
  const c = cls || '';
  const escaped = String(value).replace(/"/g, '&quot;');
  return `<input class="ef ${c}" value="${escaped}" onfocus="this.select()" onchange="${onChange}" style="width:${Math.max(String(value).length * 8 + 20, 60)}px">`;
}

function efArea(value, onChange) {
  const escaped = String(value).replace(/"/g, '&quot;').replace(/\n/g, '&#10;');
  return `<textarea class="ef ef-sm" onchange="${onChange}" style="width:100%;min-height:50px;resize:vertical">${escaped}</textarea>`;
}

// ===== UPDATE HELPERS (all auto-save) =====
function updateStop(idx, field, value) { DATA.stops[idx][field] = value; autoSave(); }
function updateStopOpt(si, oi, field, value) { DATA.stops[si].options[oi][field] = value; autoSave(); }
function toggleStopOpt(si, oi) {
  DATA.stops[si].options[oi].chosen = !DATA.stops[si].options[oi].chosen;
  renderReiserute(); autoSave();
}
function updateHotel(idx, field, value) { DATA.hotels[idx][field] = value; autoSave(); }
function updateActivity(idx, field, value) { DATA.activities[idx][field] = value; autoSave(); }
function updateBudget(idx, field, value) {
  if (field === 'amount') value = parseInt(value) || 0;
  DATA.budget[idx][field] = value;
  renderBudsjett(); autoSave();
}
function updateFlight(key, field, value) { DATA.flights[key][field] = value; autoSave(); }
function updateNotes(val) { DATA.notes = val; autoSave(); }

// Hotel price helpers
function googleHotelUrl(name, checkIn, checkOut) {
  const q = encodeURIComponent(name + ' family friendly, Bali, Indonesia');
  let url = 'https://www.google.com/travel/hotels?q=' + q + '&adults=2&children=1';
  if (checkIn && checkOut) url += '&dates=' + checkIn + 'to' + checkOut;
  return url;
}
function googleAreaSearchUrl(area, checkIn, checkOut) {
  const q = encodeURIComponent('family friendly hotel with kids club ' + area + ', Bali, Indonesia');
  let url = 'https://www.google.com/travel/hotels?q=' + q + '&adults=2&children=1';
  if (checkIn && checkOut) url += '&dates=' + checkIn + 'to' + checkOut;
  return url;
}
function calcNights(checkIn, checkOut) {
  if (!checkIn || !checkOut) return 0;
  return Math.max(0, Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000));
}
function bestHotelPrice(hotel) {
  if (!hotel.prices || !hotel.prices.length) return null;
  return hotel.prices.filter(p => p.perNight > 0).reduce((min, p) => (!min || p.perNight < min.perNight) ? p : min, null);
}
function updateHotelPrice(hi, pi, field, value) {
  const p = DATA.hotels[hi].prices[pi];
  if (field === 'perNight' && p.perNight > 0 && p.perNight !== value) {
    if (!p.history) p.history = [];
    p.history.push({ perNight: p.perNight, checkedAt: p.checkedAt || new Date().toISOString().slice(0,10) });
  }
  p[field] = value;
  if (field === 'perNight') p.checkedAt = new Date().toISOString().slice(0,10);
  autoSave();
}
function addHotelPrice(hi) {
  if (!DATA.hotels[hi].prices) DATA.hotels[hi].prices = [];
  DATA.hotels[hi].prices.push({ source:'', perNight:0, currency:'NOK', url:'', checkedAt:new Date().toISOString().slice(0,10), history:[] });
  renderHotell(); autoSave();
}
function deleteHotelPrice(hi, pi) {
  DATA.hotels[hi].prices.splice(pi, 1);
  renderHotell(); autoSave();
}
function migrateHotels() {
  if (!DATA.hotels) return;
  let changed = false;
  DATA.hotels.forEach(h => {
    if (h.price && !h.prices) {
      const num = parseInt(String(h.price).replace(/[^0-9]/g, '')) || 0;
      h.prices = [{ source:'Estimat', perNight:num, currency:'NOK', url:'', checkedAt:'' }];
      delete h.price;
      changed = true;
    }
    if (!h.prices) { h.prices = []; changed = true; }
    if (!h.status) { h.status = 'considering'; changed = true; }
    if (h.checkIn === undefined) { h.checkIn = ''; changed = true; }
    if (h.checkOut === undefined) { h.checkOut = ''; changed = true; }
    if (h.babyFriendly === undefined) { h.babyFriendly = false; changed = true; }
    if (h.babyNotes === undefined) { h.babyNotes = ''; changed = true; }
    if (h.prices) h.prices.forEach(p => {
      if (!p.history) { p.history = []; changed = true; }
    });
  });
  if (changed) autoSave();
}

// ===== DELETE / ADD =====
function deleteStop(idx) { if(confirm('Slett stopp?')){ DATA.stops.splice(idx,1); renderReiserute(); drawRoute(); autoSave(); }}
function addStop() {
  DATA.stops.splice(DATA.stops.length - 1, 0, {
    id:'s'+Date.now(), name:'Nytt stopp', dates:'Datoer', desc:'Beskrivelse...', status:'open',
    tags:[], lat:-8.5, lng:115.3, color:'#94a3b8', options:[]
  });
  renderReiserute(); drawRoute(); autoSave();
}
function deleteHotel(idx) { if(confirm('Slett hotell?')){ DATA.hotels.splice(idx,1); renderHotell(); autoSave(); }}
function addHotel() {
  DATA.hotels.push({ id:'h'+Date.now(), name:'Nytt hotell', area:'Område', stars:3, desc:'Beskrivelse', features:[], lat:-8.5, lng:115.3, checkIn:'', checkOut:'', status:'considering', babyFriendly:false, babyNotes:'', prices:[] });
  renderHotell(); autoSave();
}
function deleteActivity(idx) { if(confirm('Slett aktivitet?')){ DATA.activities.splice(idx,1); renderAktiviteter(); autoSave(); }}
function addActivity() {
  DATA.activities.push({ id:'a'+Date.now(), name:'Ny aktivitet', area:'Område', cat:'natur', desc:'Beskrivelse', baby:true, price:'Pris', lat:-8.5, lng:115.3 });
  renderAktiviteter(); autoSave();
}
function deleteBudget(idx) { DATA.budget.splice(idx,1); renderBudsjett(); autoSave(); }
function addBudget() {
  DATA.budget.push({ id:'b'+Date.now(), icon:'📌', label:'Ny post', amount:0, note:'Detaljer...' });
  renderBudsjett(); autoSave();
}

// ===== RENDER =====
function render() {
  renderNav();
  renderReiserute();
  renderHotell();
  renderAktiviteter();
  renderBudsjett();
  renderPakkeliste();
  renderNotater();
  drawRoute();
}

const TABS = [
  {id:'reiserute',label:'Reiserute'},
  {id:'hotell',label:'Hotell'},
  {id:'aktiviteter',label:'Aktiviteter'},
  {id:'budsjett',label:'Budsjett'},
  {id:'pakkeliste',label:'Pakkeliste'},
  {id:'notater',label:'Notater'}
];

function renderNav() {
  document.getElementById('nav').innerHTML = TABS.map(t =>
    `<button class="${activeTab===t.id?'on':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('') + `<button onclick="showFullRoute()" style="margin-left:auto;opacity:0.6">🗺 Vis rute</button>`;
}

function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  renderNav();
  if (id === 'reiserute') drawRoute();
}

// ----- REISERUTE -----
function renderReiserute() {
  const el = document.getElementById('p-reiserute');
  const statusBadge = s => s === 'booked' ? '<span class="badge b-booked">BOOKET</span>' :
    s === 'considering' ? '<span class="badge b-considering">VURDERES</span>' :
    s === 'open' ? '<span class="badge b-open">ÅPENT</span>' : '';
  const tagClass = t => {
    const l = t.toLowerCase();
    return l.includes('strand') || l.includes('snorkl') ? 't-s' : l.includes('kultur') || l.includes('mat') ? 't-k' : l.includes('natur') ? 't-n' : 't-b';
  };

  let html = `<h2>Reiserute</h2><p class="desc">Klikk for å se på kart. Alt kan redigeres — klikk på tekst for å endre.</p>`;

  // Flights
  html += `<div class="flights">`;
  for (const [k,f] of Object.entries(DATA.flights)) {
    html += `<div class="fl-card">
      <div class="lbl">${ef(f.label, "updateFlight('${k}','label',this.value)")}</div>
      <div style="font-weight:600">${ef(f.route, "updateFlight('${k}','route',this.value)")}</div>
      <div style="font-size:0.8rem;color:var(--dim)">${ef(f.details, "updateFlight('${k}','details',this.value)", 'ef-sm')}</div>
    </div>`;
  }
  html += `</div>`;

  // Stops
  DATA.stops.forEach((s, i) => {
    html += `<div class="icard" data-name="${s.name}" onclick="focusOnItem('${s.name.replace(/'/g,"\\'")}',${s.lat},${s.lng},'${s.desc.replace(/'/g,"\\'")}')" >
      <span class="map-pin">📍</span>
      <span class="del-btn" onclick="event.stopPropagation();deleteStop(${i})">✕</span>
      <div class="dates">${ef(s.dates,"updateStop(${i},'dates',this.value);event.stopPropagation()",'ef-sm')} ${statusBadge(s.status)}
        <select style="background:var(--card);border:1px solid var(--brd);color:var(--dim);font-size:0.65rem;border-radius:4px;padding:1px 3px;margin-left:4px" onchange="updateStop(${i},'status',this.value);renderReiserute();event.stopPropagation()">
          <option value="" ${s.status===''?'selected':''}>—</option>
          <option value="booked" ${s.status==='booked'?'selected':''}>Booket</option>
          <option value="considering" ${s.status==='considering'?'selected':''}>Vurderes</option>
          <option value="open" ${s.status==='open'?'selected':''}>Åpent</option>
        </select>
      </div>
      <h3>${ef(s.name, "updateStop(${i},'name',this.value);event.stopPropagation()")}</h3>
      <div onclick="event.stopPropagation()">${efArea(s.desc, "updateStop(${i},'desc',this.value)")}</div>
      <div>${s.tags.map(t => `<span class="tag ${tagClass(t)}">${t}</span>`).join('')}
        <input class="ef ef-sm" placeholder="+ tag" style="width:60px" onkeydown="if(event.key==='Enter'){DATA.stops[${i}].tags.push(this.value);this.value='';renderReiserute();event.stopPropagation()}" onclick="event.stopPropagation()">
      </div>`;

    // Options (sub-choices)
    if (s.options.length) {
      html += `<div style="margin-top:0.6rem;" onclick="event.stopPropagation()">`;
      s.options.forEach((o, oi) => {
        html += `<div style="padding:0.5rem;margin-top:0.35rem;background:${o.chosen?'rgba(52,211,153,0.08)':'rgba(255,255,255,0.03)'};border:1px solid ${o.chosen?'var(--a4)':'var(--brd)'};border-radius:8px;cursor:pointer;transition:all 0.15s" onclick="toggleStopOpt(${i},${oi})">
          <span style="font-size:0.85rem;font-weight:600">${o.chosen?'✅ ':''}</span>
          ${ef(o.name, "updateStopOpt(${i},${oi},'name',this.value);event.stopPropagation()")}
          — <span class="ef-price">${ef(o.price, "updateStopOpt(${i},${oi},'price',this.value);event.stopPropagation()", 'ef-price ef-sm')}</span>
          <div style="font-size:0.78rem;color:var(--dim);margin-top:0.15rem">${ef(o.note, "updateStopOpt(${i},${oi},'note',this.value);event.stopPropagation()", 'ef-sm')}</div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  html += `<button class="add-btn" onclick="addStop()">+ Legg til stopp</button>`;
  el.innerHTML = html;
}

// ----- HOTELL -----
function renderHotell() {
  const el = document.getElementById('p-hotell');
  const statusLabel = s => ({considering:'VURDERES', favorite:'FAVORITT', booked:'BOOKET', rejected:'AVVIST'}[s] || '');
  const statusClass = s => ({considering:'hs-cons', favorite:'hs-fav', booked:'hs-book', rejected:'hs-rej'}[s] || '');

  let html = `<h2>Hotell</h2><p class="desc">Familievennlige hotell med tilgjengelighet for dine datoer. Klikk "Sjekk Google" for oppdaterte priser.</p>`;

  // Filter toggle
  html += `<div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
    <button class="tbtn${window._hotelBabyFilter?' primary':''}" onclick="window._hotelBabyFilter=!window._hotelBabyFilter;renderHotell()">
      ${window._hotelBabyFilter?'Viser kun baby-vennlige':'Vis kun baby-vennlige'}
    </button>
    <span style="font-size:0.75rem;color:var(--dim)">Alle søk inkluderer 2 voksne + 1 barn, og filtrerer på dine reisedatoer</span>
  </div>`;

  // Area search buttons
  const areas = [...new Set(DATA.hotels.map(h => h.area))];
  html += `<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1rem">
    <span style="font-size:0.75rem;color:var(--dim);align-self:center">Finn nye hotell:</span>`;
  areas.forEach(area => {
    const hotelsInArea = DATA.hotels.filter(h => h.area === area);
    const ci = hotelsInArea[0]?.checkIn || '';
    const co = hotelsInArea[0]?.checkOut || '';
    html += `<a class="goog-btn" href="${googleAreaSearchUrl(area, ci, co)}" target="_blank">${area}</a>`;
  });
  html += `</div>`;

  // Quick comparison table
  let visible = DATA.hotels.filter(h => h.status !== 'rejected');
  if (window._hotelBabyFilter) visible = visible.filter(h => h.babyFriendly);
  if (visible.length) {
    html += `<table class="cmp-tbl"><thead><tr><th>Hotell</th><th>Område</th><th>Baby</th><th>Netter</th><th>Beste pris/natt</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>`;
    visible.forEach(h => {
      const idx = DATA.hotels.indexOf(h);
      const best = bestHotelPrice(h);
      const nights = calcNights(h.checkIn, h.checkOut);
      const total = best && nights ? best.perNight * nights : 0;
      const esc = s => s.replace(/'/g, "\\'");
      html += `<tr class="${h.status==='favorite'?'best-row':''}">
        <td style="font-weight:600;cursor:pointer" onclick="focusOnItem('${esc(h.name)}',${h.lat},${h.lng},'${esc(h.desc)}')">${h.name}</td>
        <td>${h.area}</td>
        <td style="text-align:center">${h.babyFriendly ? '<span title="'+(h.babyNotes||'')+'">&#x1F476;</span>' : '<span style="opacity:0.3">—</span>'}</td>
        <td>${nights || '—'}</td>
        <td>${best ? best.perNight.toLocaleString('nb-NO')+' kr' : '—'}<span style="font-size:0.68rem;color:var(--dim);margin-left:0.3rem">${best ? best.source : ''}</span></td>
        <td style="font-weight:600">${total ? total.toLocaleString('nb-NO')+' kr' : '—'}</td>
        <td><span class="h-status ${statusClass(h.status)}">${statusLabel(h.status)}</span></td>
        <td><a class="goog-btn" href="${googleHotelUrl(h.name, h.checkIn, h.checkOut)}" target="_blank" onclick="event.stopPropagation()">Sjekk Google</a></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  // Detailed cards
  const cardsToShow = window._hotelBabyFilter ? DATA.hotels.filter(h => h.babyFriendly) : DATA.hotels;
  cardsToShow.forEach(h => {
    const i = DATA.hotels.indexOf(h);
    const nights = calcNights(h.checkIn, h.checkOut);
    const best = bestHotelPrice(h);
    const esc = s => s.replace(/'/g, "\\'");
    html += `<div class="icard${h.status==='rejected'?' hs-rej':''}" data-name="${h.name}" onclick="focusOnItem('${esc(h.name)}',${h.lat},${h.lng},'${esc(h.desc)}')" >
      <span class="map-pin">📍</span>
      <span class="del-btn" onclick="event.stopPropagation();deleteHotel(${i})">✕</span>
      <div style="font-size:0.72rem;color:var(--a1);font-weight:600">
        ${ef(h.area, "updateHotel("+i+",'area',this.value);event.stopPropagation()",'ef-sm')} · ${'★'.repeat(h.stars)}${'☆'.repeat(5-h.stars)}
        <select style="background:var(--card);border:1px solid var(--brd);color:var(--dim);font-size:0.65rem;border-radius:4px;padding:1px 3px;margin-left:4px" onchange="updateHotel(${i},'status',this.value);renderHotell();event.stopPropagation()">
          <option value="considering" ${h.status==='considering'?'selected':''}>Vurderes</option>
          <option value="favorite" ${h.status==='favorite'?'selected':''}>Favoritt</option>
          <option value="booked" ${h.status==='booked'?'selected':''}>Booket</option>
          <option value="rejected" ${h.status==='rejected'?'selected':''}>Avvist</option>
        </select>
        <span class="h-status ${statusClass(h.status)}">${statusLabel(h.status)}</span>
      </div>
      <h3>${ef(h.name, "updateHotel("+i+",'name',this.value);event.stopPropagation()")}</h3>
      <div onclick="event.stopPropagation()">${efArea(h.desc, "updateHotel("+i+",'desc',this.value)")}</div>

      <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.4rem;flex-wrap:wrap" onclick="event.stopPropagation()">
        <span class="tag ${h.babyFriendly?'t-b':'t-k'}" style="cursor:pointer" onclick="DATA.hotels[${i}].babyFriendly=!DATA.hotels[${i}].babyFriendly;renderHotell();autoSave()">${h.babyFriendly?'&#x1F476; Baby-vennlig':'&#x26A0;&#xFE0F; Ikke baby-vennlig'}</span>
        ${h.babyFriendly && h.babyNotes ? `<span style="font-size:0.72rem;color:var(--dim)">${ef(h.babyNotes, "updateHotel("+i+",'babyNotes',this.value)",'ef-sm')}</span>` : ''}
        ${!h.babyFriendly ? '' : ''}
      </div>

      <div class="dates-row" onclick="event.stopPropagation()">
        <span>Innsjekk:</span>
        <input type="date" value="${h.checkIn||''}" onchange="updateHotel(${i},'checkIn',this.value);renderHotell()">
        <span>Utsjekk:</span>
        <input type="date" value="${h.checkOut||''}" onchange="updateHotel(${i},'checkOut',this.value);renderHotell()">
        ${nights ? `<span style="color:var(--a1);font-weight:600">${nights} netter</span>` : ''}
      </div>`;

    // Price comparison table
    if (h.prices && h.prices.length) {
      html += `<table class="price-tbl" onclick="event.stopPropagation()">`;
      h.prices.forEach((p, pi) => {
        const isBest = best && p.perNight === best.perNight && p.perNight > 0;
        const total = nights ? p.perNight * nights : 0;
        const hist = p.history || [];
        const trend = hist.length ? (() => {
          const prev = hist[hist.length - 1].perNight;
          const diff = p.perNight - prev;
          if (diff < 0) return `<span style="color:var(--a4);font-size:0.68rem" title="Ned fra ${prev} kr">&#x2193; ${Math.abs(diff)} kr</span>`;
          if (diff > 0) return `<span style="color:var(--red);font-size:0.68rem" title="Opp fra ${prev} kr">&#x2191; ${diff} kr</span>`;
          return '';
        })() : '';
        html += `<tr>
          <td class="src">${ef(p.source, "updateHotelPrice("+i+","+pi+",'source',this.value)",'ef-sm')}</td>
          <td class="${isBest?'best-price':''}">
            <input class="ef ef-price" type="number" value="${p.perNight}" onchange="updateHotelPrice(${i},${pi},'perNight',parseInt(this.value)||0);renderHotell()" style="width:70px;text-align:right" onclick="this.select()"> kr/natt ${trend}
          </td>
          <td style="color:var(--dim);font-size:0.75rem">${total ? total.toLocaleString('nb-NO')+' kr total' : ''}</td>
          <td style="font-size:0.68rem;color:var(--dim)">${p.checkedAt || ''}${hist.length ? ` <span style="cursor:help;opacity:0.5" title="Prishistorikk:\n${hist.map(h=>'  '+h.checkedAt+': '+h.perNight+' kr').join('\n')}">(${hist.length} endring${hist.length>1?'er':''})</span>` : ''}</td>
          <td>
            ${p.url ? `<a href="${p.url}" target="_blank" style="font-size:0.7rem">Lenke</a>` : `<input class="ef ef-sm" placeholder="URL" style="width:60px" onchange="updateHotelPrice(${i},${pi},'url',this.value)">`}
            <span style="cursor:pointer;color:var(--red);font-size:0.7rem;margin-left:0.3rem" onclick="deleteHotelPrice(${i},${pi})">✕</span>
          </td>
        </tr>`;
      });
      html += `</table>`;
    }

    html += `<div onclick="event.stopPropagation()" style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;margin-top:0.5rem">
      <button class="add-price-btn" onclick="addHotelPrice(${i})">+ Legg til pris</button>
      <a class="goog-btn" href="${googleHotelUrl(h.name, h.checkIn, h.checkOut)}" target="_blank">Sjekk på Google</a>
    </div>`;

    html += `<div style="margin-top:0.3rem">${h.features.map(f => `<span class="tag t-s">${f}</span>`).join('')}
      <input class="ef ef-sm" placeholder="+ feature" style="width:70px" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter'){DATA.hotels[${i}].features.push(this.value);this.value='';renderHotell()}">
    </div>`;

    html += `</div>`;
  });

  html += `<button class="add-btn" onclick="addHotel()">+ Legg til hotell</button>`;
  el.innerHTML = html;
}

// ----- AKTIVITETER -----

  DATA.activities.forEach((a, i) => {
    html += `<div class="icard" data-name="${a.name}" onclick="focusOnItem('${a.name.replace(/'/g,"\\'")}',${a.lat},${a.lng},'${a.desc.replace(/'/g,"\\'")}')" >
      <span class="map-pin">📍</span>
      <span class="del-btn" onclick="event.stopPropagation();deleteActivity(${i})">✕</span>
      <div style="font-size:0.72rem;color:var(--a1);font-weight:600">${ef(a.area, "updateActivity(${i},'area',this.value);event.stopPropagation()",'ef-sm')}</div>
      <h3>${ef(a.name, "updateActivity(${i},'name',this.value);event.stopPropagation()")}</h3>
      <div onclick="event.stopPropagation()">${efArea(a.desc, "updateActivity(${i},'desc',this.value)")}</div>
      <div style="margin-top:0.3rem">
        <span class="ef-price">${ef(a.price, "updateActivity(${i},'price',this.value);event.stopPropagation()",'ef-price ef-sm')}</span>
        <span class="tag ${a.baby?'t-b':'t-k'}" style="cursor:pointer" onclick="event.stopPropagation();DATA.activities[${i}].baby=!DATA.activities[${i}].baby;renderAktiviteter()">${a.baby?'👶 Baby-vennlig':'⚠️ Tøft med baby'}</span>
      </div>
    </div>`;
  });
  html += `<button class="add-btn" onclick="addActivity()">+ Legg til aktivitet</button>`;
  el.innerHTML = html;
}

  html += `<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-bottom:1rem">
    <table class="btable">`;
  DATA.budget.forEach((b, i) => {
    html += `<tr>
      <td style="white-space:nowrap">${ef(b.icon,"updateBudget(${i},'icon',this.value)",'ef-sm')} ${ef(b.label,"updateBudget(${i},'label',this.value)")}</td>
      <td style="text-align:right;white-space:nowrap"><input class="ef ef-price" type="number" value="${b.amount}" onchange="updateBudget(${i},'amount',this.value)" style="width:90px;text-align:right" onclick="event.stopPropagation();this.select()"> kr
        <span class="del-btn" style="position:static;opacity:0.4;cursor:pointer;font-size:0.75rem" onclick="deleteBudget(${i})">✕</span>
      </td>
    </tr>
    <tr><td colspan="2" style="padding:0.1rem 0.4rem 0.5rem;font-size:0.75rem;color:var(--dim)">${ef(b.note,"updateBudget(${i},'note',this.value)",'ef-sm')}</td></tr>`;
  });
  html += `<tr class="total"><td>TOTALT</td><td class="amt" style="text-align:right">${total.toLocaleString('nb-NO')} kr</td></tr>`;
  html += `</table></div>`;
  html += `<button class="add-btn" onclick="addBudget()">+ Legg til budsjettpost</button>`;
  html += `<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-top:0.5rem">
    <h3 style="font-size:0.95rem;margin-bottom:0.5rem">Sparetips</h3>
    <ul style="color:var(--dim);font-size:0.82rem;padding-left:1rem">
      <li>Warung-mat: 15-25 kr/måltid (IDR 25-40k)</li>
      <li>Grab-app: halvparten av taxipris</li>
      <li>Book direkte — billigere enn Booking.com</li>
      <li>Lokalt SIM-kort: ~30-50 kr for 30 dager</li>
      <li>Prute på markeder — start på halvparten</li>
    </ul>
  </div>`;
  el.innerHTML = html;
}

// ----- PAKKELISTE -----
function renderPakkeliste() {
  const el = document.getElementById('p-pakkeliste');
  let html = `<h2>Pakkeliste</h2><p class="desc">Klikk for å huke av. Lagres når dere lagrer fil.</p><div class="pack-grid">`;
  DATA.packing.forEach((cat, ci) => {
    html += `<div class="pack-cat"><h3>${cat.cat}</h3><ul>`;
    cat.items.forEach((item, ii) => {
      const done = cat.checked.includes(ii);
      html += `<li class="${done?'done':''}" onclick="togglePack(${ci},${ii})"><span class="ck"></span><span>${item}</span></li>`;
    });
    html += `</ul>
      <input class="ef ef-sm" placeholder="+ nytt element" style="width:100%;margin-top:0.4rem" onkeydown="if(event.key==='Enter'&&this.value){DATA.packing[${ci}].items.push(this.value);this.value='';renderPakkeliste();autoSave()}">
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

function togglePack(ci, ii) {
  const arr = DATA.packing[ci].checked;
  const idx = arr.indexOf(ii);
  if (idx > -1) arr.splice(idx, 1); else arr.push(ii);
  renderPakkeliste(); autoSave();
}

// ----- NOTATER -----
function renderNotater() {
  document.getElementById('p-notater').innerHTML = `
    <h2>Notater</h2>
    <p class="desc">Skriv ned tanker, spørsmål og huskeliste. Lagres med "Lagre fil".</p>
    <textarea class="notes" oninput="updateNotes(this.value)">${DATA.notes}</textarea>`;
}

// ===== INIT =====
async function init() {
  initEmptyData();
  initMap();
  const el = document.getElementById('saveStatus');
  const loaded = await loadFromAPI();
  if (loaded) {
    migrateHotels(); // upgrade old hotel format to new price-comparison model
    el.textContent = 'Lastet fra database ✓'; el.style.color = 'var(--a4)';
  } else {
    el.textContent = 'Ny plan — lagrer standarddata...'; el.style.color = 'var(--a1)';
    autoSave(); // save defaults to DB
  }
  render();
}
init();
</script>
