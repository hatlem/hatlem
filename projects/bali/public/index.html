<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali 2026 — Reiseplanlegger</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--a1:#38bdf8;--a2:#818cf8;--a3:#f472b6;--a4:#34d399;--a5:#fbbf24;--tx:#f1f5f9;--dim:#94a3b8;--brd:#334155;--red:#ef4444}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:var(--a1);text-decoration:none}

/* Top bar */
.topbar{background:rgba(15,23,42,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);padding:0.5rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2000;flex-wrap:wrap;gap:0.5rem}
.topbar h1{font-size:1.1rem;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tbtn{background:var(--card);border:1px solid var(--brd);color:var(--tx);font-family:inherit;font-size:0.75rem;padding:0.35rem 0.7rem;border-radius:6px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.tbtn:hover{border-color:var(--a1);background:var(--card2)}
.tbtn.primary{background:var(--a4);color:var(--bg);border-color:var(--a4);font-weight:600}
.tbtn.primary:hover{opacity:0.9}

/* Nav */
.nav{display:flex;gap:0.2rem;padding:0.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--brd);flex-wrap:wrap;position:sticky;top:42px;z-index:1999}
.nav button{background:transparent;border:1px solid transparent;color:var(--dim);font-family:inherit;font-size:0.8rem;font-weight:500;padding:0.4rem 1rem;border-radius:7px;cursor:pointer;transition:all 0.2s}
.nav button:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav button.on{background:var(--a1);color:var(--bg)}

/* Layout */
.main{display:flex;min-height:calc(100vh - 90px)}
.content{flex:1;padding:1.5rem;max-width:900px;overflow-y:auto}
.sidebar{width:400px;min-width:340px;border-left:1px solid var(--brd);position:sticky;top:90px;height:calc(100vh - 90px);display:flex;flex-direction:column}
#map{flex:1;min-height:300px}
.sidebar-info{padding:0.75rem;background:var(--card);border-top:1px solid var(--brd);font-size:0.82rem;color:var(--dim);max-height:180px;overflow-y:auto}
.sidebar-info h4{color:var(--tx);margin-bottom:0.3rem}

.page{display:none}
.page.on{display:block}
.page h2{font-size:1.5rem;font-weight:700;margin-bottom:0.2rem}
.page .desc{color:var(--dim);font-size:0.85rem;margin-bottom:1.25rem}

/* Editable field */
.ef{background:transparent;border:1px solid transparent;border-radius:4px;color:inherit;font:inherit;padding:1px 4px;transition:all 0.15s;cursor:text;min-width:30px}
.ef:hover{border-color:var(--brd);background:rgba(255,255,255,0.03)}
.ef:focus{outline:none;border-color:var(--a1);background:rgba(56,189,248,0.06)}
.ef-price{color:var(--a4);font-weight:600}
.ef-sm{font-size:0.82rem}

/* Cards */
.icard{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-bottom:0.75rem;transition:all 0.2s;cursor:pointer;position:relative}
.icard:hover{border-color:var(--a1);background:var(--card2)}
.icard.active{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1)}
.icard .dates{font-size:0.72rem;color:var(--a1);font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
.icard h3{font-size:1rem;margin:0.15rem 0}
.icard p{color:var(--dim);font-size:0.82rem}
.badge{display:inline-block;font-size:0.6rem;padding:0.12rem 0.45rem;border-radius:8px;font-weight:600;margin-left:0.4rem;vertical-align:middle}
.b-booked{background:rgba(251,191,36,0.2);color:var(--a5)}
.b-open{background:rgba(244,114,182,0.2);color:var(--a3)}
.b-considering{background:rgba(129,140,248,0.2);color:var(--a2)}
.tag{display:inline-block;font-size:0.65rem;padding:0.12rem 0.45rem;border-radius:14px;margin-top:0.3rem;margin-right:0.2rem;font-weight:500}
.t-s{background:rgba(56,189,248,0.15);color:var(--a1)}
.t-k{background:rgba(129,140,248,0.15);color:var(--a2)}
.t-n{background:rgba(52,211,153,0.15);color:var(--a4)}
.t-b{background:rgba(244,114,182,0.15);color:var(--a3)}

/* Hotel comparison */
.price-tbl{width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:0.5rem}
.price-tbl td{padding:0.25rem 0.4rem;border-bottom:1px solid rgba(255,255,255,0.04)}
.price-tbl .best-price{color:var(--a4);font-weight:700}
.price-tbl .src{color:var(--dim);font-size:0.72rem}
.goog-btn{display:inline-flex;align-items:center;gap:0.3rem;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25);color:var(--a1);font-family:inherit;font-size:0.72rem;padding:0.3rem 0.65rem;border-radius:6px;cursor:pointer;transition:all 0.2s;text-decoration:none}
.goog-btn:hover{background:rgba(56,189,248,0.18);border-color:var(--a1)}
.h-status{display:inline-block;font-size:0.6rem;padding:0.12rem 0.45rem;border-radius:8px;font-weight:600;margin-left:0.3rem}
.hs-fav{background:rgba(251,191,36,0.2);color:var(--a5)}
.hs-book{background:rgba(52,211,153,0.2);color:var(--a4)}
.hs-cons{background:rgba(129,140,248,0.2);color:var(--a2)}
.hs-rej{background:rgba(239,68,68,0.15);color:var(--red)}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:0.82rem;margin-bottom:1.25rem;background:var(--card);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.cmp-tbl th{text-align:left;padding:0.6rem 0.75rem;border-bottom:2px solid var(--brd);color:var(--dim);font-weight:500;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em}
.cmp-tbl td{padding:0.55rem 0.75rem;border-bottom:1px solid var(--brd)}
.cmp-tbl tr:hover td{background:rgba(255,255,255,0.02)}
.cmp-tbl tr.row-booked td{background:rgba(52,211,153,0.12);border-left:3px solid var(--a4)}
.cmp-tbl tr.row-booked td:first-child{box-shadow:inset 3px 0 0 var(--a4)}
.cmp-tbl tr.row-favorite td{background:rgba(251,191,36,0.08)}
.cmp-tbl tr.row-favorite td:first-child{box-shadow:inset 3px 0 0 var(--a5)}
.cmp-tbl tr.row-rejected td{opacity:0.45;text-decoration:line-through}
.cmp-tbl tr.row-rejected td:last-child{text-decoration:none}
.icard.card-booked{border-color:var(--a4);background:rgba(52,211,153,0.05);box-shadow:0 0 0 1px var(--a4)}
.icard.card-favorite{border-color:var(--a5);background:rgba(251,191,36,0.04)}
.icard.card-rejected{opacity:0.5}
.icard.card-rejected h3{text-decoration:line-through}
.dates-row{display:flex;gap:0.5rem;align-items:center;margin-top:0.4rem;font-size:0.78rem;color:var(--dim);flex-wrap:wrap}
.dates-row input[type="date"]{background:var(--card);border:1px solid var(--brd);color:var(--tx);font-family:inherit;font-size:0.78rem;padding:0.2rem 0.4rem;border-radius:4px}
.dates-row input[type="date"]:focus{border-color:var(--a1);outline:none}
.add-price-btn{background:transparent;border:1px dashed var(--brd);color:var(--dim);font-family:inherit;font-size:0.72rem;padding:0.25rem 0.5rem;border-radius:4px;cursor:pointer}
.add-price-btn:hover{border-color:var(--a1);color:var(--a1)}

/* Stop type indicators */
.stop-type{display:inline-flex;align-items:center;gap:0.25rem;font-size:0.7rem;padding:0.15rem 0.5rem;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;margin-right:0.3rem}
.type-sleep{background:rgba(56,189,248,0.15);color:var(--a1);border-left:3px solid var(--a1)}
.type-activity{background:rgba(52,211,153,0.15);color:var(--a4);border-left:3px solid var(--a4)}
.type-transport{background:rgba(129,140,248,0.15);color:var(--a2);border-left:3px solid var(--a2)}
.icard.stop-sleep{border-left:3px solid var(--a1)}
.icard.stop-activity{border-left:3px solid var(--a4)}
.icard.stop-transport{border-left:3px solid var(--a2)}

/* Insert between stops */
.insert-slot{position:relative;height:8px;margin:-4px 0;cursor:pointer;transition:all 0.15s}
.insert-slot:hover{height:36px;margin:0.4rem 0}
.insert-slot::after{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:2px;background:transparent;transition:background 0.15s}
.insert-slot:hover::after{background:rgba(56,189,248,0.3)}
.insert-slot-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--a1);color:var(--bg);padding:0.25rem 0.75rem;border-radius:6px;font-size:0.72rem;font-weight:600;white-space:nowrap;opacity:0;transition:opacity 0.15s;pointer-events:none}
.insert-slot:hover .insert-slot-btn{opacity:1}

/* Map pin icon on card */
.map-pin{position:absolute;top:0.75rem;right:0.75rem;font-size:1rem;opacity:0.4;transition:opacity 0.2s}
.icard:hover .map-pin,.icard.active .map-pin{opacity:1}

/* Delete btn on card */
.del-btn{position:absolute;top:0.75rem;right:2.2rem;font-size:0.85rem;opacity:0;cursor:pointer;transition:opacity 0.2s;color:var(--red)}
.icard:hover .del-btn{opacity:0.6}
.del-btn:hover{opacity:1!important}

/* Add button */
.add-btn{background:transparent;border:2px dashed var(--brd);border-radius:12px;padding:0.75rem;text-align:center;color:var(--dim);font-family:inherit;font-size:0.85rem;cursor:pointer;width:100%;transition:all 0.2s;margin-bottom:0.75rem}
.add-btn:hover{border-color:var(--a1);color:var(--a1)}

/* Budget table */
.btable{width:100%;border-collapse:collapse;font-size:0.85rem}
.btable td{padding:0.5rem 0.4rem;border-bottom:1px solid var(--brd)}
.btable .total td{border-top:2px solid var(--a1);font-weight:700;font-size:1rem;padding-top:0.75rem}
.btable .total .amt{color:var(--a3);font-size:1.15rem}

/* Pack */
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0.75rem}
.pack-cat{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem}
.pack-cat h3{font-size:0.9rem;margin-bottom:0.5rem}
.pack-cat ul{list-style:none}
.pack-cat li{display:flex;align-items:center;gap:0.4rem;padding:0.25rem 0;font-size:0.82rem;color:var(--dim);cursor:pointer}
.pack-cat li:hover{color:var(--tx)}
.ck{width:16px;height:16px;border:2px solid var(--brd);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
li.done .ck{background:var(--a4);border-color:var(--a4)}
li.done .ck::after{content:'\2713';color:var(--bg);font-size:0.65rem;font-weight:700}
li.done{text-decoration:line-through;opacity:0.45}

/* Notes */
.notes{width:100%;min-height:200px;background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:0.75rem;color:var(--tx);font-family:inherit;font-size:0.88rem;resize:vertical}
.notes:focus{outline:none;border-color:var(--a1)}

/* Flights */
.flights{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem}
.fl-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:0.75rem 1rem;flex:1;min-width:240px}
.fl-card .lbl{font-size:0.65rem;color:var(--a1);text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

/* Responsive — tablet */
@media(max-width:900px){
  .main{flex-direction:column}
  .sidebar{width:100%;min-width:unset;position:relative;top:auto;height:0;overflow:hidden;border-left:none;border-top:1px solid var(--brd);transition:height 0.3s}
  .sidebar.map-open{height:300px}
  .content{max-width:100%}
  .map-toggle{display:flex!important}
}

/* Responsive — phone */
@media(max-width:640px){
  /* Prevent iOS zoom on focused inputs — needs 16px minimum */
  input,textarea,select{font-size:16px!important}
  .ef{font-size:16px!important}
  .ef-sm{font-size:16px!important}
  input[type="date"]{font-size:16px!important}

  .topbar{padding:0.5rem 0.75rem;gap:0.4rem}
  .topbar h1{font-size:1rem}
  #saveStatus{font-size:0.65rem!important}

  .nav{padding:0.4rem 0.5rem;gap:0.1rem;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;top:38px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex-shrink:0;padding:0.4rem 0.7rem;font-size:0.75rem}

  .content{padding:1rem 0.75rem}
  .page h2{font-size:1.2rem;margin-bottom:0.15rem}
  .page .desc{font-size:0.78rem;margin-bottom:1rem}

  .main{min-height:unset}
  .sidebar{height:240px;top:80px}

  /* Horizontally scrollable comparison tables */
  .cmp-tbl{display:none}
  .cmp-tbl th,.cmp-tbl td{padding:0.45rem 0.6rem}
  .cmp-tbl tr.row-booked td:first-child,.cmp-tbl tr.row-favorite td:first-child{box-shadow:inset 4px 0 0 currentColor}

  .price-tbl{font-size:0.75rem}
  .price-tbl td{padding:0.35rem 0.3rem}

  .btable{font-size:0.8rem}
  .btable td{padding:0.4rem 0.3rem}

  /* Cards — less padding */
  .icard{padding:0.85rem;margin-bottom:0.6rem}
  .icard h3{font-size:1rem}
  .icard p{font-size:0.8rem}

  /* Always-visible delete + map pin (no hover on touch devices) */
  .del-btn{opacity:0.5!important;font-size:1rem;padding:0.25rem}
  .map-pin{opacity:0.6!important}

  /* Bigger touch targets for insert slot */
  .insert-slot{height:28px;margin:0.1rem 0;opacity:0.3}
  .insert-slot::after{background:rgba(56,189,248,0.2)}
  .insert-slot .insert-slot-btn{opacity:0.7;font-size:0.7rem;padding:0.2rem 0.6rem}

  /* Flight cards stack vertically */
  .flights{flex-direction:column;gap:0.5rem}
  .fl-card{min-width:0;width:100%;padding:0.65rem 0.85rem}

  /* Packing list single column */
  .pack-grid{grid-template-columns:1fr;gap:0.5rem}
  .pack-cat{padding:0.85rem}

  /* Dates row wraps cleanly */
  .dates-row{gap:0.3rem 0.4rem;font-size:0.8rem}
  .dates-row input[type="date"]{font-size:16px!important;padding:0.3rem 0.4rem;flex:1;min-width:130px}

  /* Goog button */
  .goog-btn{padding:0.4rem 0.7rem;font-size:0.75rem}

  /* Stop type selector row */
  .stop-type{font-size:0.65rem;padding:0.2rem 0.5rem}

  /* Status badges */
  .badge,.h-status{font-size:0.6rem}

  /* Buttons */
  .tbtn,.add-price-btn{padding:0.45rem 0.7rem;font-size:0.78rem;min-height:36px}
  .add-btn{padding:0.85rem;font-size:0.85rem}

  /* Notes textarea */
  .notes{font-size:16px!important;min-height:160px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Bali 2026</h1>
  <div style="display:flex;align-items:center;gap:0.5rem">
    <button class="tbtn map-toggle" onclick="toggleMap()" style="display:none">Vis kart</button>
    <span id="saveStatus" style="font-size:0.65rem;color:var(--red);opacity:0"></span>
  </div>
</div>

<nav class="nav" id="nav"></nav>

<div class="main">
  <div class="content">
    <div class="page on" id="p-reiserute"></div>
    <div class="page" id="p-hotell"></div>
    <div class="page" id="p-aktiviteter"></div>
    <div class="page" id="p-budsjett"></div>
    <div class="page" id="p-pakkeliste"></div>
    <div class="page" id="p-notater"></div>
  </div>
  <div class="sidebar">
    <div id="map"></div>
    <div class="sidebar-info" id="sidebarInfo">
      <h4>Klikk på et element for å se det på kartet</h4>
      <p>Alle reisestopp, hotell og aktiviteter kan klikkes for å vise plasseringen.</p>
    </div>
  </div>
</div>

<script>
// ===== GLOBALS =====
let DATA = {};
let activeTab = 'reiserute';
let activeMapItem = null;
let map, markers = [], polyline;

// ===== DEFAULT DATA =====
function initEmptyData() {
  DATA = {
    tripStart: '2026-08-21',
    tripEnd: '2026-09-15',
    flights: {
      out: { label:'Utreise', route:'', details:'' },
      ret: { label:'Hjemreise', route:'', details:'' }
    },
    stops: [],
    hotels: [],
    activities: [],
    budget: [],
    packing: [],
    notes: ''
  };
}

// ===== STORAGE: Railway Postgres via API =====
// API_BASE auto-detects: if served from Railway, use relative path; if local file, use full Railway URL.
// AFTER DEPLOY: replace YOUR_RAILWAY_DOMAIN below with your actual Railway domain!
const RAILWAY_URL = 'https://bali-production-9a13.up.railway.app';
const API_BASE = (location.protocol === 'file:' || location.hostname === 'localhost' && location.port !== (window._serverPort||'3000'))
  ? RAILWAY_URL + '/bali/api'
  : '/bali/api';

let saveTimer = null;

async function loadFromAPI() {
  try {
    const r = await fetch(API_BASE + '/data', { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const data = await r.json();
      if (data && data.stops) { DATA = data; return true; }
    }
  } catch(e) { console.warn('API load failed:', e.message); }
  return false;
}

function autoSave() {
  clearTimeout(saveTimer);
  const el = document.getElementById('saveStatus');

  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch(API_BASE + '/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(DATA)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (el) { el.style.opacity = '0'; }
    } catch(e) {
      console.error('Save failed:', e);
      if (el) { el.textContent = 'Kunne ikke lagre!'; el.style.color = 'var(--red)'; el.style.opacity = '1'; }
    }
  }, 400);
}


// ===== MAP =====
function toggleMap() {
  const sidebar = document.querySelector('.sidebar');
  sidebar.classList.toggle('map-open');
  const btn = document.querySelector('.map-toggle');
  btn.textContent = sidebar.classList.contains('map-open') ? 'Skjul kart' : 'Vis kart';
  if (sidebar.classList.contains('map-open')) setTimeout(() => map.invalidateSize(), 350);
}

function initMap() {
  map = L.map('map').setView([-8.55, 115.35], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'© OSM © CARTO', maxZoom:19
  }).addTo(map);
}

function clearMap() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (polyline) { map.removeLayer(polyline); polyline = null; }
}

function drawRoute() {
  clearMap();
  DATA.stops.forEach((s, i) => {
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:28px;height:28px;border-radius:50%;background:${s.color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#0f172a;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);cursor:pointer;">${i+1}</div>`,
      iconSize:[28,28], iconAnchor:[14,14]
    });
    const m = L.marker([s.lat, s.lng], {icon}).addTo(map)
      .bindPopup(`<b>${s.name}</b><br><small>${s.dates}</small>`);
    m.on('click', () => focusOnItem(s.name, s.lat, s.lng, s.desc));
    markers.push(m);
  });
  const coords = DATA.stops.map(s => [s.lat, s.lng]);
  polyline = L.polyline(coords, {color:'#38bdf8', weight:2, opacity:0.4, dashArray:'6,6'}).addTo(map);
  map.fitBounds(polyline.getBounds().pad(0.15));
}

function flyTo(lat, lng, name, detail) {
  map.flyTo([lat, lng], 14, {duration:0.8});
  clearMap();
  const m = L.marker([lat, lng]).addTo(map)
    .bindPopup(`<b>${name}</b>${detail ? '<br><small>'+detail+'</small>' : ''}`).openPopup();
  markers.push(m);
  // Also draw route faintly
  const coords = DATA.stops.map(s => [s.lat, s.lng]);
  polyline = L.polyline(coords, {color:'#38bdf8', weight:1, opacity:0.2, dashArray:'4,4'}).addTo(map);
}

function focusOnItem(name, lat, lng, detail) {
  activeMapItem = name;
  flyTo(lat, lng, name, detail);
  showSidebar(name, detail || '');
  highlightCard(name);
}

function showSidebar(title, text) {
  document.getElementById('sidebarInfo').innerHTML = `<h4>${title}</h4><p>${text}</p>`;
}

function highlightCard(name) {
  document.querySelectorAll('.icard').forEach(c => c.classList.remove('active'));
  const el = document.querySelector(`.icard[data-name="${CSS.escape(name)}"]`);
  if (el) el.classList.add('active');
}

async function geocodeHotel(idx) {
  const h = DATA.hotels[idx];
  const q = h.address || (h.name + ', ' + h.area + ', Bali, Indonesia');
  const statusEl = document.getElementById('saveStatus');
  if (statusEl) { statusEl.textContent = 'Søker på kart...'; statusEl.style.color = 'var(--a1)'; }
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q) + '&limit=1', {
      headers: { 'Accept': 'application/json' }
    });
    const data = await r.json();
    if (data.length) {
      DATA.hotels[idx].lat = parseFloat(data[0].lat);
      DATA.hotels[idx].lng = parseFloat(data[0].lon);
      DATA.hotels[idx].geocoded = true;
      if (!h.address && data[0].display_name) DATA.hotels[idx].address = data[0].display_name;
      renderHotell();

    } else {
      if (statusEl) { statusEl.textContent = 'Fant ikke adressen — skriv mer spesifikt'; statusEl.style.color = 'var(--red)'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.textContent = 'Kart-søk feilet'; statusEl.style.color = 'var(--red)'; }

}

function googleHotelUrl(name, checkIn, checkOut) {

}
function googleAreaSearchUrl(area, checkIn, checkOut) {

function calcNights(checkIn, checkOut) {
  if (!checkIn || !checkOut) return 0;
  return Math.max(0, Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000));
}
function bestHotelPrice(hotel) {
  if (!hotel.prices || !hotel.prices.length) return null;
  return hotel.prices.filter(p => p.perNight > 0).reduce((min, p) => (!min || p.perNight < min.perNight) ? p : min, null);
}

// For hotels with paid bookings (possibly split in segments), return the exact paid total
// Returns { total, perNightAvg, nights, hasBookings } or null
function hotelBookedCost(hotel) {
  const paidPrices = (hotel.prices || []).filter(p => p.paid && (p.totalPaid > 0));
  if (paidPrices.length === 0) return null;
  const total = paidPrices.reduce((s, p) => s + (p.totalPaid || 0), 0);
  const nights = paidPrices.reduce((s, p) => s + (p.segmentNights || 0), 0) || calcNights(hotel.checkIn, hotel.checkOut);
  return { total, nights, perNightAvg: nights ? total / nights : 0, segments: paidPrices };
}
function updateHotelPrice(hi, pi, field, value) {
  const p = DATA.hotels[hi].prices[pi];
  if (field === 'perNight' && p.perNight > 0 && p.perNight !== value) {
    if (!p.history) p.history = [];
    p.history.push({ perNight: p.perNight, checkedAt: p.checkedAt || new Date().toISOString().slice(0,10) });
  }
  p[field] = value;
  if (field === 'perNight') p.checkedAt = new Date().toISOString().slice(0,10);
  // When user enters totalPaid, compute perNight from segment nights (if set) else hotel nights
  if (field === 'totalPaid' && value > 0) {
    const nights = p.segmentNights || calcNights(DATA.hotels[hi].checkIn, DATA.hotels[hi].checkOut);
    if (nights > 0) p.perNight = Math.round((value / nights) * 100) / 100;
    p.checkedAt = new Date().toISOString().slice(0,10);
  }
  autoSave();
}

const NO_MONTHS = {
  'jan':1,'januar':1,'feb':2,'februar':2,'mar':3,'mars':3,'apr':4,'april':4,
  'mai':5,'jun':6,'juni':6,'jul':7,'juli':7,'aug':8,'august':8,
  'sep':9,'september':9,'okt':10,'oktober':10,'nov':11,'november':11,'des':12,'desember':12
};

function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function parseNoDateRange(text, year = 2026) {
  if (!text) return null;
  // Get nights count if present (for single-date entries with N natt)
  const nightsMatch = text.match(/(\d+)\s*(?:natt|netter)/i);
  const nights = nightsMatch ? parseInt(nightsMatch[1]) : 0;
  // Remove everything after "•" or bullet
  const clean = text.split('•')[0].trim();

  // Range: "22. – 27. aug" or "28. aug – 4. sep" (both en-dash and em-dash)
  const rangeMatch = clean.match(/(\d+)\.\s*(?:(\w+)\s*)?[–\-]\s*(\d+)\.\s*(\w+)/);
  if (rangeMatch) {
    const [, d1, m1, d2, m2] = rangeMatch;
    const month1 = NO_MONTHS[(m1 || m2).toLowerCase()];
    const month2 = NO_MONTHS[m2.toLowerCase()];
    if (month1 && month2) {
      const start = new Date(year, month1 - 1, parseInt(d1));
      // "22. – 27. aug • 6 netter" means last night is Aug 27, checkout is Aug 28
      const end = new Date(year, month2 - 1, parseInt(d2) + 1);
      return { startDate: toISODate(start), endDate: toISODate(end) };
    }
  }

  // Single date: "21. aug" or "15. sep"
  const singleMatch = clean.match(/(\d+)\.\s*(\w+)/);
  if (singleMatch) {
    const [, d, m] = singleMatch;
    const month = NO_MONTHS[m.toLowerCase()];
    if (month) {
      const start = new Date(year, month - 1, parseInt(d));
      // If "1 natt" or similar, endDate = start + nights; else = start (transport)
      const end = nights ? new Date(year, month - 1, parseInt(d) + nights) : start;
      return { startDate: toISODate(start), endDate: toISODate(end) };
    }
  }

  return null;
}

function migrateStops() {
  if (!DATA.stops) return;
  let changed = false;
  DATA.stops.forEach(s => {
    if (s.type === undefined) {
      const n = (s.name || '').toLowerCase();
      if (n.includes('fly') || n.includes('hjemreise') || n.includes('ankomst') || n.includes('transport')) {
        s.type = 'transport';
      } else {
        s.type = 'overnatting';
      }
      changed = true;
    }
    if (s.startDate === undefined) { s.startDate = ''; changed = true; }
    if (s.endDate === undefined) { s.endDate = ''; changed = true; }

    // Parse existing `dates` text into proper date fields if empty
    if ((!s.startDate || !s.endDate) && s.dates) {
      const parsed = parseNoDateRange(s.dates);
      if (parsed) {
        if (!s.startDate) s.startDate = parsed.startDate;
        if (!s.endDate) s.endDate = parsed.endDate;
        changed = true;
      }
    }
  });
  if (changed) autoSave();
}

function updateStopDates(idx, field, value) {
  DATA.stops[idx][field] = value;
  // Chain: when endDate changes, auto-update next stop's startDate
  if (field === 'endDate' && DATA.stops[idx + 1] && value) {
    DATA.stops[idx + 1].startDate = value;
  }
  // Chain: when startDate changes, auto-update prev stop's endDate
  if (field === 'startDate' && DATA.stops[idx - 1] && value) {
    DATA.stops[idx - 1].endDate = value;
  }
  // Update all formatted `dates` strings
  DATA.stops.forEach(s => {
    if (s.startDate && s.endDate) {
      const d1 = new Date(s.startDate), d2 = new Date(s.endDate);
      const nights = Math.max(0, Math.round((d2 - d1) / 86400000));
      const fmt = d => d.toLocaleDateString('nb-NO', { day:'numeric', month:'short' });
      s.dates = `${fmt(d1)} – ${fmt(d2)}${nights ? ' • ' + nights + ' netter' : ''}`;
    } else if (s.startDate) {
      s.dates = new Date(s.startDate).toLocaleDateString('nb-NO', { day:'numeric', month:'short' });
    }
  });
  autoSave();
}

// Compute min/max date for a stop's date picker based on adjacent stops and trip range
function getStopDateBounds(idx, field) {
  const tripStart = DATA.tripStart || '2026-08-21';
  const tripEnd = DATA.tripEnd || '2026-09-15';
  if (field === 'startDate') {
    const prev = DATA.stops[idx - 1];
    return {
      min: prev?.endDate || prev?.startDate || tripStart,
      max: DATA.stops[idx].endDate || tripEnd
    };
  } else {
    const next = DATA.stops[idx + 1];
    return {
      min: DATA.stops[idx].startDate || tripStart,
      max: next?.startDate || tripEnd
    };
  }
}

function migrateActivities() {
  if (!DATA.activities) return;
  let changed = false;
  DATA.activities.forEach(a => {
    if (a.cost === undefined) {
      // Try to parse the price string to extract kr amount
      const priceStr = String(a.price || '').toLowerCase();
      if (priceStr.includes('gratis') || priceStr.includes('inkl')) {
        a.cost = 0;
      } else {
        const match = priceStr.match(/(\d[\d\s]*)\s*kr/);
        a.cost = match ? parseInt(match[1].replace(/\s/g, '')) : 0;
      }
      changed = true;
    }
    if (a.planned === undefined) { a.planned = false; changed = true; }
  });
  if (changed) autoSave();
}

function migrateHotels() {
  if (!DATA.hotels) return;
  let changed = false;
  DATA.hotels.forEach(h => {
    if (h.price && !h.prices) {
      // Extract first number before "kr" only (not ALL digits joined together)
      const priceStr = String(h.price);
      const krMatch = priceStr.match(/(\d[\d\s]*)\s*kr/);
      const num = krMatch ? parseInt(krMatch[1].replace(/\s/g, '')) || 0 : 0;
      h.prices = [{ source:'Estimat', perNight:num, currency:'NOK', url:'', checkedAt:'' }];
      delete h.price;
      changed = true;
    }
    if (!h.prices) { h.prices = []; changed = true; }
    if (!h.status) { h.status = 'considering'; changed = true; }
    if (h.checkIn === undefined) { h.checkIn = ''; changed = true; }
    if (h.checkOut === undefined) { h.checkOut = ''; changed = true; }
    if (h.babyFriendly === undefined) { h.babyFriendly = false; changed = true; }
    if (h.babyNotes === undefined) { h.babyNotes = ''; changed = true; }
    if (h.bookingRef === undefined) { h.bookingRef = ''; changed = true; }
    if (h.roomType === undefined) { h.roomType = ''; changed = true; }
    if (h.address === undefined) { h.address = ''; changed = true; }
    if (h.geocoded === undefined) { h.geocoded = false; changed = true; }
    if (h.prices) h.prices.forEach(p => {
      if (!p.history) { p.history = []; changed = true; }
      if (p.totalPaid === undefined) { p.totalPaid = 0; changed = true; }
      if (p.paid === undefined) { p.paid = false; changed = true; }
    });
  });
  if (changed) autoSave();
}

function renderReiserute() {

    s === 'considering' ? '<span class="badge b-considering">VURDERES</span>' :

  };

      <div class="lbl">${ef(f.label, "updateFlight('${k}','label',this.value)")}</div>
      <div style="font-weight:600">${ef(f.route, "updateFlight('${k}','route',this.value)")}</div>
      <div style="font-size:0.8rem;color:var(--dim)">${ef(f.details, "updateFlight('${k}','details',this.value)", 'ef-sm')}</div>
    </div>`;
  }
  html += `</div>`;

  // Type labels/classes
  const typeLabel = t => ({overnatting:'🏨 Overnatting', utflukt:'🗺️ Utflukt', transport:'✈️ Transport'}[t] || '🏨 Overnatting');

  const cardTypeClass = t => ({overnatting:'stop-sleep', utflukt:'stop-activity', transport:'stop-transport'}[t] || 'stop-sleep');

  };

  // Stops — clean cards, no insert slots

    const esc = str => (str||'').replace(/'/g, "\\'");
    const startBounds = getStopDateBounds(i, 'startDate');
    const endBounds = getStopDateBounds(i, 'endDate');

      <span class="del-btn" onclick="event.stopPropagation();deleteStop(${i})">✕</span>

      <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.3rem" onclick="event.stopPropagation()">

        ${statusBadge(s.status)}
      </div>

      <h3 style="font-size:1.1rem;margin-bottom:0.2rem">${ef(s.name, "updateStop("+i+",'name',this.value);event.stopPropagation()")}</h3>
      <div onclick="event.stopPropagation()" style="margin-bottom:0.4rem">${efArea(s.desc, "updateStop("+i+",'desc',this.value)")}</div>

      <div class="dates-row" onclick="event.stopPropagation()">
        <input type="date" value="${s.startDate||''}" min="${startBounds.min}" max="${startBounds.max}" onchange="updateStopDates(${i},'startDate',this.value);renderReiserute();drawRoute()">
        ${s.type!=='transport' ? `<span>→</span>
          <input type="date" value="${s.endDate||''}" min="${endBounds.min}" max="${endBounds.max}" onchange="updateStopDates(${i},'endDate',this.value);renderReiserute();drawRoute()">` : ''}
      </div>`;

    // Show matching hotel — compact, no jargon
    if (s.type === 'overnatting' && s.startDate && s.endDate) {
      const matching = (DATA.hotels || []).filter(h => h.checkIn && h.checkOut && h.checkIn < s.endDate && h.checkOut > s.startDate);
      if (matching.length) {
        matching.forEach(h => {
          const hi = DATA.hotels.indexOf(h);
          const booked = hotelBookedCost(h);
          const best = bestHotelPrice(h);
          const nights = calcNights(h.checkIn, h.checkOut);
          const total = booked ? booked.total : (best && nights ? best.perNight * nights : 0);
          const icon = h.status==='booked' ? '✓ ' : h.status==='favorite' ? '⭐ ' : '';
          const bg = h.status==='booked' ? 'rgba(52,211,153,0.06)' : 'rgba(255,255,255,0.02)';
          html += `<div style="padding:0.4rem 0.6rem;margin-top:0.4rem;background:${bg};border-radius:6px;font-size:0.82rem;display:flex;justify-content:space-between;align-items:center;gap:0.4rem" onclick="event.stopPropagation()">

            <span style="color:var(--dim);font-size:0.75rem;white-space:nowrap">${total ? total.toLocaleString('nb-NO',{maximumFractionDigits:0})+' kr' : ''}</span>
          </div>`;
        });
      } else {
        html += `<div style="margin-top:0.4rem;padding:0.4rem 0.6rem;border:1px dashed rgba(251,191,36,0.2);border-radius:6px;font-size:0.78rem;color:var(--a5);cursor:pointer" onclick="event.stopPropagation();switchTab('hotell')">
          Ikke booket — <span style="color:var(--a1);text-decoration:underline">velg hotell</span>
        </div>`;
      }
    }
    html += `</div>`;
  });

  html += `<button class="add-btn" onclick="addStop()">+ Legg til stopp</button>`;
  el.innerHTML = html;
}

// ----- HOTELL -----
function renderHotell() {
  const el = document.getElementById('p-hotell');
  const statusLabel = s => ({considering:'VURDERES', favorite:'FAVORITT', booked:'BOOKET', rejected:'AVVIST'}[s] || '');
  const statusClass = s => ({considering:'hs-cons', favorite:'hs-fav', booked:'hs-book', rejected:'hs-rej'}[s] || '');

  let html = `<h2>Hotell</h2>`;

  // Filter toggle
  html += `<div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
    <button class="tbtn${window._hotelBabyFilter?' primary':''}" onclick="window._hotelBabyFilter=!window._hotelBabyFilter;renderHotell()">
      ${window._hotelBabyFilter?'Viser kun baby-vennlige':'Vis kun baby-vennlige'}
    </button>
    <span style="font-size:0.75rem;color:var(--dim)">Alle søk inkluderer 2 voksne + 1 barn, og filtrerer på dine reisedatoer</span>
  </div>`;

  // Area search buttons
  const areas = [...new Set(DATA.hotels.map(h => h.area))];
  html += `<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1rem">
    <span style="font-size:0.75rem;color:var(--dim);align-self:center">Finn nye hotell:</span>`;
  areas.forEach(area => {
    const hotelsInArea = DATA.hotels.filter(h => h.area === area);
    const ci = hotelsInArea[0]?.checkIn || '';
    const co = hotelsInArea[0]?.checkOut || '';
    html += `<a class="goog-btn" href="${googleAreaSearchUrl(area, ci, co)}" target="_blank">${area}</a>`;
  });
  html += `</div>`;

  // Sort: booked > favorite > considering > rejected, then by area, then by price
  const statusOrder = { booked:0, favorite:1, considering:2, rejected:3 };
  const sortedHotels = [...DATA.hotels].sort((a,b) => {
    const d = (statusOrder[a.status]??2) - (statusOrder[b.status]??2);
    if (d !== 0) return d;
    if (a.area !== b.area) return (a.area||'').localeCompare(b.area||'');
    const ap = bestHotelPrice(a)?.perNight || Infinity;
    const bp = bestHotelPrice(b)?.perNight || Infinity;
    return ap - bp;
  });

  // Quick comparison table — show ALL hotels, with visual distinction
  let visible = sortedHotels;
  if (window._hotelBabyFilter) visible = visible.filter(h => h.babyFriendly);
  if (visible.length) {
    html += `<table class="cmp-tbl"><thead><tr><th>Hotell</th><th>Område</th><th>★</th><th>Baby</th><th>Netter</th><th>Pris/natt</th><th>Total</th><th>Status</th><th>Rating</th><th>Book</th></tr></thead><tbody>`;
    visible.forEach(h => {
      const booked = hotelBookedCost(h);
      const best = bestHotelPrice(h);
      const nights = booked ? booked.nights : calcNights(h.checkIn, h.checkOut);
      // Prefer booked sum (exact multi-segment paid), else best quote × nights
      const total = booked ? booked.total : (best && nights ? best.perNight * nights : 0);
      const perNight = booked ? booked.perNightAvg : (best?.perNight || 0);
      const esc = s => s.replace(/'/g, "\\'");
      const rowClass = 'row-' + (h.status || 'considering');
      const icon = h.status==='booked' ? '&#x2713; ' : h.status==='favorite' ? '&#x2B50; ' : '';
      const fmtPrice = n => n.toLocaleString('nb-NO', {maximumFractionDigits: 2});
      html += `<tr class="${rowClass}">
        <td style="font-weight:600;cursor:pointer" onclick="focusOnItem('${esc(h.name)}',${h.lat},${h.lng},'${esc(h.desc)}')">${icon}${h.name}</td>
        <td>${h.area}</td>
        <td style="text-align:center;font-size:0.7rem;color:var(--a1)">${h.stars||'—'}</td>
        <td style="text-align:center">${h.babyFriendly ? '<span title="'+(h.babyNotes||'')+'">&#x1F476;</span>' : '<span style="opacity:0.3">—</span>'}</td>
        <td>${nights || '—'}</td>
        <td>${perNight ? fmtPrice(perNight)+' kr' : '—'}<span style="font-size:0.68rem;color:var(--dim);margin-left:0.3rem">${best ? best.source : ''}</span></td>
        <td style="font-weight:600">${total ? fmtPrice(total)+' kr' : '—'}</td>
        <td><span class="h-status ${statusClass(h.status)}">${statusLabel(h.status)}</span></td>
        <td style="font-size:0.68rem;color:var(--dim);max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${h.reviewSummary||''}">${h.bookingRating ? h.bookingRating+'/10' : h.googleRating ? 'G'+h.googleRating : '—'}</td>
        <td><a class="goog-btn" href="${h.bookingUrl||googleHotelUrl(h.name, h.checkIn, h.checkOut)}" target="_blank" onclick="event.stopPropagation()" style="font-size:0.65rem;padding:2px 6px">Book</a></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  // Detailed cards — same sort order as table, show all
  const cardsToShow = window._hotelBabyFilter ? sortedHotels.filter(h => h.babyFriendly) : sortedHotels;
  cardsToShow.forEach(h => {
    const i = DATA.hotels.indexOf(h);
    const nights = calcNights(h.checkIn, h.checkOut);
    const best = bestHotelPrice(h);
    const esc = s => s.replace(/'/g, "\\'");
    const cardStatusClass = h.status==='booked' ? ' card-booked' : h.status==='favorite' ? ' card-favorite' : h.status==='rejected' ? ' card-rejected' : '';
    html += `<div class="icard${cardStatusClass}" data-name="${h.name}" onclick="focusOnItem('${esc(h.name)}',${h.lat},${h.lng},'${esc(h.desc)}')" >
      <span class="map-pin">📍</span>
      <span class="del-btn" onclick="event.stopPropagation();deleteHotel(${i})">✕</span>
      <div style="font-size:0.72rem;color:var(--a1);font-weight:600">
        ${ef(h.area, "updateHotel("+i+",'area',this.value);event.stopPropagation()",'ef-sm')} · ${'★'.repeat(h.stars)}${'☆'.repeat(5-h.stars)}
        <select style="background:var(--card);border:1px solid var(--brd);color:var(--dim);font-size:0.65rem;border-radius:4px;padding:1px 3px;margin-left:4px" onchange="updateHotel(${i},'status',this.value);renderHotell();event.stopPropagation()">
          <option value="considering" ${h.status==='considering'?'selected':''}>Vurderes</option>
          <option value="favorite" ${h.status==='favorite'?'selected':''}>Favoritt</option>
          <option value="booked" ${h.status==='booked'?'selected':''}>Booket</option>
          <option value="rejected" ${h.status==='rejected'?'selected':''}>Avvist</option>
        </select>
        <span class="h-status ${statusClass(h.status)}">${statusLabel(h.status)}</span>
      </div>
      <h3>${ef(h.name, "updateHotel("+i+",'name',this.value);event.stopPropagation()")}</h3>
      <div onclick="event.stopPropagation()">${efArea(h.desc, "updateHotel("+i+",'desc',this.value)")}</div>

      <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.4rem;flex-wrap:wrap" onclick="event.stopPropagation()">
        <span class="tag ${h.babyFriendly?'t-b':'t-k'}" style="cursor:pointer" onclick="DATA.hotels[${i}].babyFriendly=!DATA.hotels[${i}].babyFriendly;renderHotell();autoSave()">${h.babyFriendly?'&#x1F476; Baby-vennlig':'&#x26A0;&#xFE0F; Ikke baby-vennlig'}</span>
        ${h.babyFriendly && h.babyNotes ? `<span style="font-size:0.72rem;color:var(--dim)">${ef(h.babyNotes, "updateHotel("+i+",'babyNotes',this.value)",'ef-sm')}</span>` : ''}
        ${!h.babyFriendly ? '' : ''}
      </div>

      <div class="dates-row" onclick="event.stopPropagation()">
        <span>Innsjekk:</span>
        <input type="date" value="${h.checkIn||''}" min="${DATA.tripStart||''}" max="${h.checkOut||DATA.tripEnd||''}" onchange="updateHotel(${i},'checkIn',this.value);renderHotell()">
        <span>Utsjekk:</span>
        <input type="date" value="${h.checkOut||''}" min="${h.checkIn||DATA.tripStart||''}" max="${DATA.tripEnd||''}" onchange="updateHotel(${i},'checkOut',this.value);renderHotell()">
        ${nights ? `<span style="color:var(--a1);font-weight:600">${nights} netter</span>` : ''}
      </div>
      <div class="dates-row" onclick="event.stopPropagation()">
        <span>${h.geocoded ? '📍' : '📌'} Adresse:</span>
        <input type="text" value="${(h.address||'').replace(/"/g,'&quot;')}" placeholder="F.eks: Jl. Bandara Ngurah Rai, Tuban, Bali" style="flex:1;min-width:200px;background:var(--card);border:1px solid var(--brd);color:var(--tx);font-family:inherit;font-size:0.78rem;padding:0.2rem 0.4rem;border-radius:4px" onchange="updateHotel(${i},'address',this.value)">
        <button class="add-price-btn" onclick="geocodeHotel(${i})" title="Søk opp nøyaktige koordinater">Finn på kart</button>
        ${h.geocoded ? '<span style="color:var(--a4);font-size:0.68rem" title="Nøyaktige koordinater">✓ Presis</span>' : '<span style="color:var(--a5);font-size:0.68rem" title="Omtrentlig lokasjon">~ Omtrentlig</span>'}
      </div>
      ${h.status === 'booked' ? `
        <div onclick="event.stopPropagation()" style="margin-top:0.5rem;padding:0.5rem 0.75rem;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.3);border-radius:6px;font-size:0.78rem">
          <div style="color:var(--a4);font-weight:600;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.25rem">&#x2713; Bestilt</div>
          <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap">
            <span style="color:var(--dim);font-size:0.72rem">Bestillingsref:</span>
            ${ef(h.bookingRef || '', "updateHotel("+i+",'bookingRef',this.value)", 'ef-sm')}
          </div>
          <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;margin-top:0.2rem">
            <span style="color:var(--dim);font-size:0.72rem">Romtype:</span>
            ${ef(h.roomType || '', "updateHotel("+i+",'roomType',this.value)", 'ef-sm')}
          </div>
        </div>
      ` : ''}`;

    // Price comparison table
    if (h.prices && h.prices.length) {
      html += `<table class="price-tbl" onclick="event.stopPropagation()">`;
      h.prices.forEach((p, pi) => {
        const isBest = best && p.perNight === best.perNight && p.perNight > 0;
        const total = nights ? p.perNight * nights : 0;
        const hist = p.history || [];
        const trend = hist.length ? (() => {
          const prev = hist[hist.length - 1].perNight;
          const diff = p.perNight - prev;
          if (diff < 0) return `<span style="color:var(--a4);font-size:0.68rem" title="Ned fra ${prev} kr">&#x2193; ${Math.abs(diff)} kr</span>`;
          if (diff > 0) return `<span style="color:var(--red);font-size:0.68rem" title="Opp fra ${prev} kr">&#x2191; ${diff} kr</span>`;
          return '';
        })() : '';
        const displayTotal = p.totalPaid > 0 ? p.totalPaid : total;
        html += `<tr>
          <td class="src">${ef(p.source, "updateHotelPrice("+i+","+pi+",'source',this.value)",'ef-sm')}</td>
          <td class="${isBest?'best-price':''}">
            <input class="ef ef-price" type="number" value="${p.perNight}" onchange="updateHotelPrice(${i},${pi},'perNight',parseInt(this.value)||0);renderHotell()" style="width:70px;text-align:right" onclick="this.select()"> kr/natt ${trend}
          </td>
          <td style="color:var(--dim);font-size:0.75rem">
            ${p.totalPaid > 0 ? 'Total betalt: ' : 'Total: '}
            <input class="ef ef-price" type="number" value="${p.totalPaid || total}" onchange="updateHotelPrice(${i},${pi},'totalPaid',parseFloat(this.value)||0);renderHotell()" style="width:80px;text-align:right" onclick="this.select()"> kr
          </td>
          <td style="font-size:0.68rem;color:var(--dim)">${p.checkedAt || ''}${hist.length ? ` <span style="cursor:help;opacity:0.5" title="Prishistorikk:\n${hist.map(h=>'  '+h.checkedAt+': '+h.perNight+' kr').join('\n')}">(${hist.length} endring${hist.length>1?'er':''})</span>` : ''}</td>
          <td>
            ${p.url ? `<a href="${p.url}" target="_blank" style="font-size:0.7rem">Lenke</a>` : `<input class="ef ef-sm" placeholder="URL" style="width:60px" onchange="updateHotelPrice(${i},${pi},'url',this.value)">`}
            <span style="cursor:pointer;color:var(--red);font-size:0.7rem;margin-left:0.3rem" onclick="deleteHotelPrice(${i},${pi})">✕</span>
          </td>
        </tr>`;
      });
      html += `</table>`;
    }

    html += `<div onclick="event.stopPropagation()" style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;margin-top:0.5rem">
      <button class="add-price-btn" onclick="addHotelPrice(${i})">+ Legg til pris</button>
      <a class="goog-btn" href="${googleHotelUrl(h.name, h.checkIn, h.checkOut)}" target="_blank">Google Hotels</a>
      ${h.bookingUrl ? `<a class="goog-btn" href="${h.bookingUrl}" target="_blank" style="background:#003580;color:#fff;font-size:0.72rem;padding:3px 8px">Booking</a>` : ''}
      ${h.hotelsUrl ? `<a class="goog-btn" href="${h.hotelsUrl}" target="_blank" style="background:#d32f2f;color:#fff;font-size:0.72rem;padding:3px 8px">Hotels</a>` : ''}
    </div>
    ${h.reviewSummary ? `<div style="font-size:0.7rem;color:var(--dim);margin-top:0.25rem">⭐ ${h.reviewSummary}</div>` : ''}`;

    html += `<div style="margin-top:0.3rem">${h.features.map(f => `<span class="tag t-s">${f}</span>`).join('')}
      <input class="ef ef-sm" placeholder="+ feature" style="width:70px" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter'){DATA.hotels[${i}].features.push(this.value);this.value='';renderHotell()}">
    </div>`;

    html += `</div>`;
  });

  html += `<button class="add-btn" onclick="addHotel()">+ Legg til hotell</button>`;
  el.innerHTML = html;
}

      <h3>${ef(a.name, "updateActivity("+i+",'name',this.value);event.stopPropagation()")}</h3>
      <div onclick="event.stopPropagation()">${efArea(a.desc, "updateActivity("+i+",'desc',this.value)")}</div>

        <span class="tag ${a.baby?'t-b':'t-k'}" style="cursor:pointer" onclick="DATA.activities[${i}].baby=!DATA.activities[${i}].baby;renderAktiviteter()">${a.baby?'👶 Baby-vennlig':'⚠️ Tøft med baby'}</span>

  });

// ----- BUDSJETT -----
function renderBudsjett() {
  const el = document.getElementById('p-budsjett');

  // Auto: hotels with status 'booked' or 'favorite' contribute their cost to budget
  const includedHotels = DATA.hotels.filter(h => h.status === 'booked' || h.status === 'favorite');
  const hotelRows = includedHotels.map(h => {
    const booked = hotelBookedCost(h);
    if (booked) {
      return { hotel: h, cost: booked.total, nights: booked.nights, best: null, booked };
    }
    const best = bestHotelPrice(h);
    const nights = calcNights(h.checkIn, h.checkOut);
    const cost = best && nights ? best.perNight * nights : 0;
    return { hotel: h, cost, nights, best, booked: null };
  });
  const hotelTotal = hotelRows.reduce((s, r) => s + r.cost, 0);

  // Auto: activities marked as planned
  const plannedActivities = (DATA.activities || []).filter(a => a.planned);
  const activityTotal = plannedActivities.reduce((s, a) => s + (a.cost || 0), 0);

  // Manual: remaining budget items (flights, food, transport, misc)
  const manualTotal = (DATA.budget || []).reduce((s, b) => s + (b.amount || 0), 0);

  const grandTotal = hotelTotal + activityTotal + manualTotal;
  const fmt = n => n.toLocaleString('nb-NO', {maximumFractionDigits: 2});

  let html = `<h2>Budsjett</h2>`;

  // Auto section: Hotels
  html += `<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-bottom:0.75rem">
    <h3 style="font-size:0.9rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem">
      🏨 Overnatting
    </h3>`;

  if (hotelRows.length === 0) {
    html += `<p style="color:var(--dim);font-size:0.82rem">Ingen hotell merket som booket eller favoritt. Gå til <a href="#" onclick="switchTab('hotell');return false" style="color:var(--a1)">Hotell-fanen</a> og velg status.</p>`;
  } else {
    html += `<table class="btable">`;
    hotelRows.forEach(r => {
      const statusIcon = r.hotel.status === 'booked' ? '✓' : '⭐';
      html += `<tr>
        <td>${statusIcon} ${r.hotel.name} <span style="font-size:0.7rem;color:var(--dim)">· ${r.hotel.area}</span></td>
        <td style="text-align:right;color:var(--dim);font-size:0.78rem">${r.nights} ${r.nights===1?'natt':'netter'}${!r.booked && r.best ? ' × '+fmt(r.best.perNight)+' kr' : ''}</td>
        <td style="text-align:right;font-weight:600;white-space:nowrap">${fmt(r.cost)} kr</td>
      </tr>`;
      // For multi-segment bookings, show the breakdown
      if (r.booked && r.booked.segments.length > 1) {
        r.booked.segments.forEach(seg => {
          html += `<tr>
            <td style="padding-left:1.5rem;font-size:0.75rem;color:var(--dim)">↳ ${seg.source || 'Booking'}</td>
            <td style="text-align:right;color:var(--dim);font-size:0.72rem">${seg.segmentNights || '?'} natt · ${seg.bookingRef ? 'ref ' + seg.bookingRef : ''}</td>
            <td style="text-align:right;font-size:0.78rem;color:var(--dim)">${fmt(seg.totalPaid)} kr</td>
          </tr>`;
        });
      }
    });
    html += `<tr><td colspan="2" style="color:var(--dim);font-size:0.78rem">Sum hotell</td><td style="text-align:right;font-weight:700;color:var(--a1)">${fmt(hotelTotal)} kr</td></tr>`;
    html += `</table>`;
  }
  html += `</div>`;

  // Auto section: Activities
  html += `<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-bottom:0.75rem">
    <h3 style="font-size:0.9rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem">
      🎯 Aktiviteter
    </h3>`;

  if (plannedActivities.length === 0) {
    html += `<p style="color:var(--dim);font-size:0.82rem">Ingen aktiviteter merket som planlagt. Gå til <a href="#" onclick="switchTab('aktiviteter');return false" style="color:var(--a1)">Aktiviteter-fanen</a> og hak av "Planlagt".</p>`;
  } else {
    html += `<table class="btable">`;
    plannedActivities.forEach(a => {
      html += `<tr>
        <td>✓ ${a.name} <span style="font-size:0.7rem;color:var(--dim)">· ${a.area}</span></td>
        <td style="text-align:right;font-weight:600;white-space:nowrap">${fmt(a.cost || 0)} kr</td>
      </tr>`;
    });
    html += `<tr><td style="color:var(--dim);font-size:0.78rem">Sum aktiviteter</td><td style="text-align:right;font-weight:700;color:var(--a4)">${fmt(activityTotal)} kr</td></tr>`;
    html += `</table>`;
  }
  html += `</div>`;

  // Manual section: other costs (flights, food, transport, misc)
  html += `<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-bottom:0.75rem">
    <h3 style="font-size:0.9rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem">
      💸 Annet
    </h3>
    <table class="btable">`;
  (DATA.budget || []).forEach((b, i) => {
    html += `<tr>
      <td style="white-space:nowrap">${ef(b.icon,"updateBudget("+i+",'icon',this.value)",'ef-sm')} ${ef(b.label,"updateBudget("+i+",'label',this.value)")}</td>
      <td style="text-align:right;white-space:nowrap"><input class="ef ef-price" type="number" value="${b.amount}" onchange="updateBudget(${i},'amount',this.value)" style="width:90px;text-align:right" onclick="event.stopPropagation();this.select()"> kr
        <span class="del-btn" style="position:static;opacity:0.4;cursor:pointer;font-size:0.75rem" onclick="deleteBudget(${i})">✕</span>
      </td>
    </tr>
    <tr><td colspan="2" style="padding:0.1rem 0.4rem 0.5rem;font-size:0.75rem;color:var(--dim)">${ef(b.note,"updateBudget("+i+",'note',this.value)",'ef-sm')}</td></tr>`;
  });
  html += `<tr><td colspan="1" style="color:var(--dim);font-size:0.78rem">Sum manuelt</td><td style="text-align:right;font-weight:700;color:var(--a2)">${fmt(manualTotal)} kr</td></tr>`;
  html += `</table>`;
  html += `<button class="add-btn" onclick="addBudget()" style="margin-top:0.5rem">+ Legg til post</button>`;
  html += `</div>`;

  // Grand total
  html += `<div style="background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(244,114,182,0.08));border:2px solid var(--a1);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:0.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em">Totalt budsjett</div>
      <div style="font-size:0.72rem;color:var(--dim);margin-top:0.2rem">Hotell ${fmt(hotelTotal)} + Aktivitet ${fmt(activityTotal)} + Annet ${fmt(manualTotal)}</div>
    </div>
    <div style="font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent">${fmt(grandTotal)} kr</div>
  </div>`;

  html += `<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:1rem;margin-top:0.5rem">
    <h3 style="font-size:0.95rem;margin-bottom:0.5rem">Sparetips</h3>
    <ul style="color:var(--dim);font-size:0.82rem;padding-left:1rem">
      <li>Warung-mat: 15-25 kr/måltid (IDR 25-40k)</li>
      <li>Grab-app: halvparten av taxipris</li>
      <li>Book direkte — billigere enn Booking.com</li>
      <li>Lokalt SIM-kort: ~30-50 kr for 30 dager</li>
      <li>Prute på markeder — start på halvparten</li>
    </ul>
  </div>`;
  el.innerHTML = html;
}

// ----- PAKKELISTE -----
function renderPakkeliste() {
  const el = document.getElementById('p-pakkeliste');
  let html = `<h2>Pakkeliste</h2><p class="desc">Klikk for å huke av. Lagres når dere lagrer fil.</p><div class="pack-grid">`;
  DATA.packing.forEach((cat, ci) => {
    html += `<div class="pack-cat"><h3>${cat.cat}</h3><ul>`;
    cat.items.forEach((item, ii) => {
      const done = cat.checked.includes(ii);
      html += `<li class="${done?'done':''}" onclick="togglePack(${ci},${ii})"><span class="ck"></span><span>${item}</span></li>`;
    });
    html += `</ul>
      <input class="ef ef-sm" placeholder="+ nytt element" style="width:100%;margin-top:0.4rem" onkeydown="if(event.key==='Enter'&&this.value){DATA.packing[${ci}].items.push(this.value);this.value='';renderPakkeliste();autoSave()}">
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

function togglePack(ci, ii) {
  const arr = DATA.packing[ci].checked;
  const idx = arr.indexOf(ii);
  if (idx > -1) arr.splice(idx, 1); else arr.push(ii);
  renderPakkeliste(); autoSave();
}

// ----- NOTATER -----
function renderNotater() {
  document.getElementById('p-notater').innerHTML = `
    <h2>Notater</h2>
    <p class="desc">Skriv ned tanker, spørsmål og huskeliste. Lagres med "Lagre fil".</p>
    <textarea class="notes" oninput="updateNotes(this.value)">${DATA.notes}</textarea>`;
}

// ===== INIT =====
async function init() {
  initEmptyData();
  initMap();
  const el = document.getElementById('saveStatus');
  const loaded = await loadFromAPI();
  if (loaded) {
    migrateTripDates(); // ensure trip range exists
    migrateHotels(); // upgrade old hotel format to new price-comparison model
    migrateStops(); // add type/startDate/endDate to stops
    migrateActivities(); // add cost (numeric) + planned flag to activities
  } else {
    autoSave();
  }
  render();
}
init();
</script>
</body>
</html>
