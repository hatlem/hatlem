<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Kjøreplan · Admin</title>
<style>
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inputs label { margin: 0 0 4px; }
  .inputs input { text-align: center; font-size: 22px; font-weight: 800; }
  .venue { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .venue .chip span { min-height: 48px; }
  .sec h2 { font-size: 20px; margin: 22px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .sec h2 small { font-size: 14px; color: var(--muted); font-weight: 700; }
  .item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,.07); cursor: pointer; }
  .item input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--yellow); flex: none; }
  .item .t { width: 58px; flex: none; font-weight: 800; color: var(--yellow); }
  .item .what { flex: 1; }
  .item .what small { display: block; color: var(--muted); }
  .item .qty { font-weight: 800; white-space: nowrap; color: var(--cyan); }
  .item.done .what, .item.done .qty { opacity: .45; text-decoration: line-through; }
  .item.hl { background: rgba(255,210,63,.08); border-radius: 10px; padding-left: 8px; }
  .item .rm { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 0 18px; background: var(--card); color: var(--text); cursor: pointer; border: 1px solid var(--card-border); }
  .progress-line { font-weight: 800; color: var(--muted); }
  .tools { display: flex; gap: 8px; margin-top: 14px; }
  @media print {
    body::before { display: none; }
    body { background: #fff; color: #000; }
    .top, .tools, .add, .card.cfg, .item .rm { display: none !important; }
    .item { border-color: #ddd; break-inside: avoid; }
    .item .t, .item .qty, .sec h2 small, .item .what small { color: #000; }
    .wrap { max-width: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="back" href="admin">‹ Admin</a><span class="progress-line" id="progress"></span></div>
  <h1>📋 Kjøreplan</h1>
  <div id="login" class="card" hidden><p>Logg inn på <a href="admin">admin</a> først.</p></div>

  <div id="app" hidden>
    <section class="card cfg">
      <div class="inputs">
        <div><label for="adults">Voksne</label><input type="number" id="adults" min="0" max="500" inputmode="numeric"></div>
        <div><label for="kids">Barn</label><input type="number" id="kids" min="0" max="500" inputmode="numeric"></div>
      </div>
      <div class="venue chips small" id="venue">
        <label class="chip"><input type="radio" name="venue" value="inne"><span>🏠 Inne</span></label>
        <label class="chip"><input type="radio" name="venue" value="ute"><span>🌳 Ute</span></label>
        <label class="chip"><input type="radio" name="venue" value="begge"><span>🏡 Begge</span></label>
      </div>
      <p class="hint" style="margin:10px 0 0">Mengdene er anslag for et åpent hus der folk kommer og går. Avkryssing deles med alle som er logget inn i admin.</p>
    </section>
    <div class="tools">
      <button class="btn secondary" id="print" type="button">🖨️ Skriv ut</button>
    </div>
    <div id="plan"></div>
    <section class="sec">
      <h2>➕ Egne punkter</h2>
      <div id="extra"></div>
      <form class="add" id="addForm"><input type="text" id="addText" maxlength="80" placeholder="F.eks. «Hente stoler hos naboen»"><button>Legg til</button></form>
    </section>
  </div>
</main>
<script src="common.js"></script>
<script>
(function () {
  const esc = Party.esc;
  const $ = (id) => document.getElementById(id);
  let key = '';
  try { key = sessionStorage.getItem('bursdag-admin') || ''; } catch {}
  const api = (url, body) => fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': key }, body: JSON.stringify(body) } : { headers: { 'x-admin-key': key } });
  let plan = null, schedule = [], name = 'bursdagsbarnet';

  const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
  const fmt = (m) => String(Math.floor(((m % 1440) + 1440) % 1440 / 60)).padStart(2, '0') + ':' + String(((m % 60) + 60) % 60).padStart(2, '0');
  const up = Math.ceil;

  function timeline() {
    const S = schedule.length ? toMin(schedule[0].time) : 14 * 60;
    const hl = schedule.find((p) => p.highlight);
    const H = hl ? toMin(hl.time) : 17 * 60;
    const after = schedule.find((p) => toMin(p.time) > H && !/takk|stenger|slutt/i.test(p.title));
    const T3 = after ? toMin(after.time) : H + 60;
    const E = schedule.length ? toMin(schedule[schedule.length - 1].time) : 20 * 60;
    const kids = plan.kids > 0, ute = plan.venue !== 'inne';
    return [
      ['En uke før', [
        ['', 'uke-sjekk', 'Kjør generalprøven', '«npm run sjekk -- --ekte --bilde selfie.jpg»: én ekte video og én ekte sang'],
        ['', 'uke-quiz', 'Skriv quizspørsmålene om deg selv', 'party.json → quiz, og sett «eksempel»: false'],
        ['', 'uke-nostalgi', 'Legg inn nostalgibilder og årsspilleliste', 'Ett bilde per tiår, én låt per år 1986–i dag'],
        ['', 'uke-lyd', 'Test mobilen mot høyttaleren', 'Åpne /lyd, koble til Bluetooth og spill en hel sang med skjermen på'],
        ['', 'uke-handle', 'Bestill kake og handle det som holder seg', 'Se handlelisten under'],
      ]],
      ['Dagen før', [
        ['', 'dag-qr', 'Skriv ut QR-plakatene', '/qr, én per stasjon'],
        ['', 'dag-lad', 'Lad mobil, høyttaler og eventuelt polaroid', ''],
        ['', 'dag-video', 'Film en 10 sekunders video av deg selv til finalen', 'Ansiktet rett mot kamera, godt lys'],
        ['', 'dag-handle', 'Handle ferskvarer', ''],
      ]],
      ['Festdagen', [
        [fmt(S - 120), 'rigg', 'Rigg lokalet', `Skjermer, høyttaler, langbord og stasjoner${kids ? ', krabbekrok' : ''}, tegnebord, fotohjørne, gjestebok og spill${ute ? ', telt/pledd ute' : ''}`],
        [fmt(S - 60), 'skjermer', 'Start skjermene og lyden', 'Skjerm 1: /skjerm · Skjerm 2: /musikk · Mobil ved høyttaleren: /lyd'],
        [fmt(S - 50), 'plakater', 'Heng opp QR-plakatene', 'Én ved hver stasjon, og én ved inngangen'],
        [fmt(S - 30), 'test', 'Siste test: lag én sang og én selfie selv', 'Sjekk at de dukker opp på skjermen og i køen'],
        [fmt(S), 'start', 'Dørene åpner', `${kids ? 'Barneaktivitetene i gang fra start. ' : ''}Årsspillelisten går når ingen har laget sanger`],
        [fmt(S + 60), 'pafyll1', 'Påfyll av mat, runde 1', ''],
        [fmt(H - 30), 'finale', 'Lag finalen i admin', 'Velg den beste gjestesangen + videoen din'],
        [fmt(H - 15), 'lobby', 'Åpne quiz-lobbyen', 'Admin → Live-quiz → «Åpne quizen», så folk rekker å melde seg på'],
        [fmt(H), 'kake', `🎂 ${hl ? hl.title : 'Kake og tale'}`, 'Kaketid → kort tale → live-quiz → les hilsener → 🎬 finale → tilbake til vanlig', true],
        [fmt(T3), 'mingling', after ? after.title : 'Musikken opp', 'Skru opp volumet i Admin → Musikk'],
        [fmt(T3 + 30), 'pafyll2', 'Påfyll av mat, runde 2', 'Så det ikke er tomt for de som kommer sent'],
        [fmt(E - 30), 'zip', 'Last ned alt fra galleriet', '/galleri → «Last ned alt», som sikkerhetskopi'],
        [fmt(E), 'slutt', 'Takk for i dag!', ''],
      ]],
      ['Dagen etter', [
        ['', 'galleri', 'Send galleri-lenken til gjestene', '/galleri'],
      ]],
    ];
  }

  function shopping() {
    const A = plan.adults, K = plan.kids, P = A + K;
    const ute = plan.venue !== 'inne';
    const list = [
      ['🍽️ Mat (langbord)', [
        ['polser', 'Pølser', up(A * 1.5 + K * 1.5) + ' stk'],
        ['brod', 'Pølsebrød / lomper', up(A * 1.5 + K * 1.5) + ' stk'],
        ['wraps', 'Wraps (ferdige eller til å lage)', up(A * 1.5 + K * 0.5) + ' stk'],
        ['suppe', 'Suppe', (Math.round((A * 0.3 + K * 0.15) * 10) / 10) + ' liter'],
        ['frukt', 'Frukt', (Math.round(P * 0.15 * 10) / 10) + ' kg'],
        ['gront', 'Grønnsaksstaver og dipp', (Math.round(P * 0.08 * 10) / 10) + ' kg'],
        ['kake', 'Bursdagskake (ca. 12 biter per kake)', up(P / 12) + ' stk'],
        ['kaker', 'Småkaker / boller til påfyll', up(P * 1.5) + ' stk'],
      ]],
      ...(K ? [['🧒 Barnebordet (lavt bord)', [
        ['barnemat', 'Barnevennlig mat (pølsebiter, ost, kjeks)', up(K * 0.15) + ' kg'],
        ['barnedrikke', 'Saft / juice i små kartonger', up(K * 2) + ' stk'],
      ]]] : []),
      ['🥤 Drikke', [
        ['brus', 'Brus / saft', up(P * 0.6) + ' liter'],
        ['vann', 'Vann', up(P * 0.4) + ' liter'],
        ['kaffe', 'Kaffe', up(A / 40) + ' pk à 500 g'],
        ['voksen', 'Øl / vin / alkoholfritt', '≈ ' + up(A * 2) + ' enheter'],
        ['is', 'Isbiter', up(P / 15) + ' poser'],
      ]],
      ['🍴 Engangsutstyr', [
        ['tallerken', 'Tallerkener', up(P * 2) + ' stk'],
        ['kopper', 'Kopper / glass', up(P * 3) + ' stk'],
        ['bestikk', 'Bestikk', up(P * 2) + ' sett'],
        ['servietter', 'Servietter', up(P * 4) + ' stk'],
        ['sekker', 'Søppelsekker', up(P / 12) + ' stk'],
      ]],
      ['🖍️ Stasjoner', [
        ...(K ? [
          ['krabbe', 'Krabbekrok: teppe, myke leker, stellematte, bleier, våtservietter', '1 sett'],
        ] : []),
        ['ark', 'Tegneark (A4/A3), til både barn og voksne', up(K * 3 + A) + ' ark'],
        ['farger', 'Fargestifter / tusjer', up(Math.max(P, 8) / 8) + ' esker'],
        ['vegg', 'Teip / hyssing og klyper til tegneveggen', '1 sett'],
        ['rekvisitter', 'Fotohjørne: 80-tallsrekvisitter (solbriller, svetteband, neon)', '1 kasse'],
        ['polaroid', 'Polaroidfilm / fotopapir', up(P / 8) + ' pk à 8'],
        ['penner', 'Penner og lapper til gjesteboka', up(P / 10) + ' penner'],
        ['spill', ute ? 'Kubb / boccia + Uno og brettspill' : 'Uno og brettspill', '1 sett'],
      ]],
      ['📺 Teknikk', [
        ['skjermer', 'To skjermer + PC + HDMI-kabler', '1 sett'],
        ['mobil', 'Mobil til lyd + lader', '1'],
        ['hoyttaler', 'Høyttaler (Bluetooth eller kabel) + lader', '1'],
        ['skjot', 'Skjøteledninger / grenuttak', '2–3'],
        ['qr', 'Utskrevne QR-plakater', '9 ark'],
      ]],
      ['🎈 Pynt', [
        ['ballonger', 'Ballonger med «40»', up(P / 2) + ' stk'],
        ['banner', 'Banner / girlander', '2–3'],
      ]],
      ...(ute ? [['🌳 Ute', [
        ['telt', 'Partytelt / le for regn', '1'],
        ['pledd', 'Pledd og sitteunderlag', up(P / 4) + ' stk'],
        ['grill', 'Grill + kull/gass (til pølsene)', '1'],
        ['lys', 'Lykter / lys til kvelden', up(P / 10) + ' stk'],
        ['mygg', 'Myggspray', '1–2'],
      ]]] : []),
    ];
    return list;
  }

  function itemHtml(id, what, sub, right, hl) {
    const done = !!plan.checked[id];
    return `<label class="item ${done ? 'done' : ''} ${hl ? 'hl' : ''}"><input type="checkbox" data-k="${esc(id)}" ${done ? 'checked' : ''}>` +
      (right && right.t ? `<span class="t">${esc(right.t)}</span>` : '') +
      `<span class="what">${esc(what)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>` +
      (right && right.q ? `<span class="qty">${esc(right.q)}</span>` : '') + '</label>';
  }

  function render() {
    // Ikke overskriv feltet man skriver i
    if (document.activeElement !== $('adults')) $('adults').value = plan.adults;
    if (document.activeElement !== $('kids')) $('kids').value = plan.kids;
    document.querySelector(`#venue input[value="${plan.venue}"]`).checked = true;
    let total = 0, done = 0;
    const count = (id) => { total++; if (plan.checked[id]) done++; };
    let html = '<section class="sec">';
    for (const [title, items] of timeline()) {
      html += `<h2>${esc(title)}</h2>`;
      for (const [t, id, what, sub, hl] of items) { count('t:' + id); html += itemHtml('t:' + id, what, sub, { t }, hl); }
    }
    html += '</section><section class="sec"><h2>🛒 Handleliste <small>' + plan.adults + ' voksne · ' + plan.kids + ' barn</small></h2>';
    for (const [title, items] of shopping()) {
      html += `<h2 style="font-size:17px;margin-top:16px">${esc(title)}</h2>`;
      for (const [id, what, q] of items) { count('s:' + id); html += itemHtml('s:' + id, what, '', { q }); }
    }
    html += '</section>';
    $('plan').innerHTML = html;
    $('extra').innerHTML = (plan.extra || []).map((x) => {
      count('e:' + x);
      return itemHtml('e:' + x, x, '', null).replace('</label>', `<button class="rm" data-rm="${esc(x)}" aria-label="Fjern">✕</button></label>`);
    }).join('');
    $('progress').textContent = `✅ ${done} av ${total}`;
  }

  async function save(body) {
    const r = await api('api/admin/plan', body);
    if (r.ok) { plan = (await r.json()).plan; render(); }
  }

  async function load() {
    const r = await api('api/admin/plan');
    if (!r.ok) { $('login').hidden = false; return; }
    const d = await r.json();
    plan = d.plan; schedule = d.schedule; name = d.birthdayName;
    $('app').hidden = false;
    render();
  }

  document.addEventListener('change', (e) => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) save({ check: k, value: e.target.checked });
    if (e.target.id === 'adults' || e.target.id === 'kids') save({ [e.target.id]: e.target.value });
    if (e.target.name === 'venue') save({ venue: e.target.value });
  });
  document.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { e.preventDefault(); save({ removeItem: rm.dataset.rm }); }
  });
  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('addText').value.trim();
    if (v) { save({ addItem: v }); $('addText').value = ''; }
  });
  $('print').addEventListener('click', () => print());
  load();
  // Hent andres avkrysninger av og til (flere verter samtidig)
  setInterval(() => { if (plan && !document.activeElement.matches('input[type=number], input[type=text]')) load(); }, 10000);
})();
</script>
</body>
</html>
