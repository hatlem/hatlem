<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<title>QR-plakater</title>
<style>
  :root { --ink: #1d1038; --pink: #ff4fa3; --yellow: #ffd23f; --cyan: #3ee6d8; --violet: #9b6bff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Baloo 2', ui-rounded, system-ui, sans-serif; color: var(--ink); background: #f3eefc; }
  .tools { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .tools h1 { margin: 0 0 6px; }
  .warn { background: #fff3c4; border: 1px solid #f0c419; border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .warn code { background: #fff; padding: 1px 6px; border-radius: 6px; }
  button { font: inherit; font-weight: 800; font-size: 18px; border: 0; border-radius: 999px; padding: 12px 22px; background: linear-gradient(90deg, var(--yellow), var(--pink)); cursor: pointer; }
  .sheets { display: grid; gap: 24px; padding: 0 16px 40px; justify-items: center; }
  .poster {
    width: min(100%, 180mm); aspect-ratio: 210 / 297; background: #fff; padding: 10mm;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
    border: 6mm solid; border-image: var(--grad) 1; box-shadow: 0 10px 30px rgba(29,16,56,.12);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .poster .emoji { font-size: 34mm; line-height: 1; }
  .poster h2 { font-size: 15mm; line-height: 1; margin: 2mm 0; }
  .poster p { font-size: 6mm; margin: 0; max-width: 140mm; }
  .poster img { width: 85mm; height: 85mm; }
  .poster .scan { font-weight: 800; font-size: 7mm; padding: 2mm 8mm; border-radius: 999px; color: #fff; background: var(--ink); }
  .poster .url { font-size: 4mm; opacity: .6; word-break: break-all; margin-top: 2mm; }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .tools { display: none; }
    .sheets { padding: 0; gap: 0; }
    .poster { width: 210mm; height: 297mm; aspect-ratio: auto; box-shadow: none; break-after: page; border-width: 10mm; }
  }
</style>
</head>
<body>
<div class="tools">
  <h1>🖨️ QR-plakater til lokalet</h1>
  <p>Skriv ut og heng opp rundt i lokalet. Hver plakat sender gjestene rett til riktig aktivitet.</p>
  <div id="warn"></div>
  <button onclick="print()">Skriv ut</button>
</div>
<div class="sheets" id="sheets"></div>
<script>
  const POSTERS = [
    { path: '/', emoji: '🎂', title: 'Bursdagsmoro!', text: 'Lag en film av tegningen din, din egen sang eller en selfie med magisk effekt', grad: 'linear-gradient(135deg,#ffd23f,#ff4fa3,#9b6bff)' },
    { path: '/tegning', emoji: '🖍️', title: 'Tegning blir film', text: 'Tegn noe, ta bilde av det, og se det bli levende på storskjermen', grad: 'linear-gradient(135deg,#ffd23f,#ff9f1c)' },
    { path: '/sang', emoji: '🎤', title: 'Lag en sang', text: 'Velg tema og sjanger. Sangen din legges i spillelisten på festen!', grad: 'linear-gradient(135deg,#ff4fa3,#9b6bff)' },
    { path: '/selfie', emoji: '🤳', title: 'Selfie med effekt', text: 'Få en tiger til å gå rundt deg, bli et spøkelse eller fly som en superhelt', grad: 'linear-gradient(135deg,#3ee6d8,#3a86ff)' },
    { path: '/quiz', emoji: '🧠', title: 'Quiz om bursdagsbarnet', text: 'Live-quiz på storskjermen ved kaka. Skann og meld deg på nå!', grad: 'linear-gradient(135deg,#9b6bff,#3ee6d8)' },
    { path: '/hilsen', emoji: '💌', title: 'Gjestebok med vri', text: 'Gi 40-åringen ett råd, eller gjett hva bursdagsbarnet gjorde som 20-åring', grad: 'linear-gradient(135deg,#ff4fa3,#ffd23f)' },
    { path: '/klipp', emoji: '🎥', title: 'Film et klipp', text: 'Maks 15 sekunder: en hilsen, en dans eller et trylletriks rett på storskjermen', grad: 'linear-gradient(135deg,#9b6bff,#3ee6d8)' },
    { path: '/selfie?effekt=attitall', emoji: '📼', title: 'Fotohjørnet: 1986', text: 'Ta på deg 80-tallsrekvisittene, ta en selfie og bli en del av en 80-tallsvideo!', grad: 'linear-gradient(135deg,#ff4fa3,#3ee6d8)' },
    { path: '/selfie?effekt=tiger', emoji: '🐯', title: 'Tiger-hjørnet', text: 'Still deg her, ta en selfie, og se en tiger gå rundt deg!', grad: 'linear-gradient(135deg,#ff9f1c,#ff4f4f)' },
    { path: '/selfie?effekt=spokelse', emoji: '👻', title: 'Spøkelseshjørnet', text: 'Ta en selfie og forsvinn som et spøkelse …', grad: 'linear-gradient(135deg,#b8c1ff,#5b4bdb)' },
  ];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  Promise.all([fetch('api/qr-info').then((r) => r.json()), fetch('api/config').then((r) => r.json())]).then(([info, cfg]) => {
    for (const p of POSTERS) {
      p.title = p.title.replace('bursdagsbarnet', cfg.birthdayName);
      p.text = p.text.replace(/bursdagsbarnet/g, cfg.birthdayName);
    }
    if (info.local) {
      document.getElementById('warn').innerHTML = `<div class="warn">⚠️ QR-kodene peker nå til <code>${esc(info.base)}</code>, som telefoner ikke når. Åpne denne siden via nettverksadressen (${info.lan.map((u) => `<a href="${esc(u)}/qr">${esc(u)}</a>`).join(', ') || 'ingen funnet'}) eller start serveren med <code>PUBLIC_URL=https://din-adresse</code>.</div>`;
    }
    document.getElementById('sheets').innerHTML = POSTERS.map((p) => {
      const qrPath = p.path.split('?')[0];
      const query = p.path.includes('?') ? '?' + p.path.split('?')[1] : '';
      const src = 'qr.svg?path=' + encodeURIComponent(qrPath) + (query ? '&q=' + encodeURIComponent(query.slice(1)) : '');
      return `<section class="poster" style="--grad:${p.grad}">
        <div><div class="emoji">${p.emoji}</div><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></div>
        <img src="${src}" alt="QR-kode til ${esc(p.title)}">
        <div><div class="scan">📱 Skann med kameraet</div><div class="url">${esc(info.base + p.path)}</div></div>
      </section>`;
    }).join('');
  });
</script>
</body>
</html>
