<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>Storskjerm</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; cursor: none; }
  .screen { display: grid; grid-template-columns: 1fr 27vw; height: 100vh; }
  .stage { position: relative; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; display: grid; place-items: center; }
  .layer.on { opacity: 1; }
  .layer .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(0.45); }
  .layer video, .layer img { position: relative; max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
  .layer img.kb { animation: kenburns 10s ease-in-out forwards; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12) translate(-1%, -1%); } }
  .caption {
    position: absolute; left: 3vw; bottom: 3vw; right: 3vw; z-index: 2;
    display: flex; align-items: center; gap: 1.2vw;
    font-size: 2.6vw; font-weight: 800; text-shadow: 0 4px 24px rgba(0,0,0,.8);
  }
  .caption .em { font-size: 4.2vw; }
  .caption small { display: block; font-size: 1.6vw; font-weight: 600; color: var(--muted); }
  .badge-new { position: absolute; top: 3vw; left: 3vw; z-index: 2; font-size: 2vw; font-weight: 800; color: #2a0b2b; background: linear-gradient(90deg, var(--yellow), var(--pink)); padding: .4vw 1.4vw; border-radius: 999px; transform: rotate(-4deg); animation: pop .6s ease; }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); } }

  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 4vw; }
  .empty h1 { font-size: 5vw; }
  .empty .icons { font-size: 7vw; letter-spacing: 2vw; }
  .empty p { font-size: 2vw; color: var(--muted); }

  .side {
    display: flex; flex-direction: column; gap: 1.4vw; padding: 1.6vw;
    background:
      radial-gradient(600px 400px at 0% 0%, rgba(255, 79, 163, 0.35), transparent 60%),
      radial-gradient(600px 500px at 100% 100%, rgba(155, 107, 255, 0.35), transparent 60%),
      var(--bg);
    border-left: 1px solid var(--card-border);
  }
  .side h2 { font-size: 1.2vw; text-transform: uppercase; letter-spacing: .12em; color: var(--yellow); margin: 0 0 .6vw; }
  .qr { background: #fff; border-radius: 1.2vw; padding: 1vw; display: flex; align-items: center; gap: 1vw; color: #120a24; }
  .qr img { width: 9vw; height: 9vw; }
  .qr strong { font-size: 1.6vw; line-height: 1.1; }
  .qr span { display: block; font-size: 1vw; font-weight: 600; opacity: .7; margin-top: .4vw; }
  .now { background: var(--card); border: 1px solid var(--card-border); border-radius: 1.2vw; padding: 1vw; }
  .now .row2 { display: flex; gap: 1vw; align-items: center; }
  .cover { width: 6vw; height: 6vw; border-radius: .8vw; background: linear-gradient(135deg, var(--pink), var(--violet)); display: grid; place-items: center; font-size: 3vw; flex: none; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .now .title { font-size: 1.5vw; font-weight: 800; line-height: 1.1; }
  .now .by { font-size: 1.05vw; color: var(--muted); }
  .eq { display: inline-flex; gap: .2vw; align-items: flex-end; height: 1.2vw; margin-right: .4vw; }
  .eq i { width: .3vw; background: var(--cyan); animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%,100% { height: 20%; } 50% { height: 100%; } }
  .bar { height: .4vw; background: rgba(255,255,255,.12); border-radius: 999px; margin-top: .8vw; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  .queue { list-style: none; margin: 0; padding: 0; display: grid; gap: .5vw; }
  .queue li { display: flex; gap: .8vw; align-items: center; font-size: 1.1vw; background: rgba(255,255,255,.05); border-radius: .8vw; padding: .5vw .8vw; }
  .queue li b { color: var(--yellow); font-size: 1.3vw; width: 1.6vw; }
  .queue li small { display: block; color: var(--muted); font-size: .9vw; }
  .muted { color: var(--muted); font-size: 1.1vw; }
  .working { margin-top: auto; font-size: 1.2vw; color: var(--muted); }
  .working b { color: var(--cyan); }

  .toast { position: fixed; top: 2vw; left: 50%; transform: translate(-50%, -200%); z-index: 20; background: linear-gradient(90deg, var(--pink), var(--violet)); padding: 1vw 2vw; border-radius: 999px; font-size: 1.8vw; font-weight: 800; transition: transform .5s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .toast.show { transform: translate(-50%, 0); }

  .start { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; background: rgba(18,10,36,.92); cursor: pointer; }
  .start h1 { font-size: 5vw; }
  .start p { font-size: 1.8vw; color: var(--muted); }
</style>
</head>
<body>
<div class="screen">
  <section class="stage" id="stage">
    <div class="layer" id="l0"></div>
    <div class="layer" id="l1"></div>
    <div class="empty" id="empty">
      <div>
        <div class="icons">🖍️🎤🤳</div>
        <h1 class="gradient-text" id="emptyTitle">Bursdagsmoro</h1>
        <p>Skann QR-koden og lag en film, en sang eller en selfie med effekt!</p>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="qr">
      <img src="/qr.svg?path=/" alt="QR-kode til forsiden">
      <div><strong>Skann og bli med!</strong><span id="url"></span></div>
    </div>

    <div>
      <h2>Nå spilles</h2>
      <div class="now" id="now"><p class="muted">Ingen sanger ennå. Lag den første! 🎤</p></div>
    </div>

    <div>
      <h2>Neste i køen</h2>
      <ul class="queue" id="queue"><li class="muted">Tom kø</li></ul>
    </div>

    <div class="working" id="working"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<div class="start" id="start">
  <div>
    <div style="font-size:8vw">📺</div>
    <h1>Trykk for å starte storskjermen</h1>
    <p>Starter fullskjerm og musikk. Legg til <code>?lyd=av</code> i adressen på ekstra skjermer.</p>
  </div>
</div>

<script src="/common.js"></script>
<script>
(function () {
  const esc = Party.esc;
  const params = new URLSearchParams(location.search);
  const SOUND = params.get('lyd') !== 'av';
  const audio = document.getElementById('audio');
  const layers = [document.getElementById('l0'), document.getElementById('l1')];
  let active = 0;

  Party.config().then((c) => { document.getElementById('emptyTitle').textContent = c.partyTitle; });
  fetch('/api/qr-info').then((r) => r.json()).then((i) => { document.getElementById('url').textContent = i.base.replace(/^https?:\/\//, ''); });

  // ---------------------------------------------------------------- data
  let data = { gallery: [], queue: [], played: [], nowPlaying: null, working: 0 };
  const seen = new Set();
  const priority = [];
  let firstLoad = true;
  const knownSongs = new Set();

  async function refresh() {
    try {
      data = await (await fetch('/api/screen')).json();
    } catch { return; }
    for (const item of data.gallery) {
      if (!seen.has(item.id)) {
        seen.add(item.id);
        if (!firstLoad) {
          priority.push(item);
          toast(`${item.emoji || '✨'} Nytt fra ${item.guest || 'en gjest'}!`);
        }
      }
    }
    for (const s of [...data.queue, ...(data.nowPlaying ? [data.nowPlaying] : [])]) {
      if (!knownSongs.has(s.id)) {
        knownSongs.add(s.id);
        if (!firstLoad) toast(`🎵 Ny sang i køen${s.guest ? ' fra ' + s.guest : ''}!`);
      }
    }
    firstLoad = false;
    document.getElementById('empty').style.display = data.gallery.length ? 'none' : '';
    renderSide();
    if (!showing && data.gallery.length) next();
    if (SOUND && started && fallback && data.queue.length) playNext(null); // ny sang i kø: avbryt reprise
  }

  // ---------------------------------------------------------------- galleri
  let showing = false, idx = 0, timer = null;
  function next() {
    clearTimeout(timer);
    if (!data.gallery.length) { showing = false; return; }
    showing = true;
    let item, isNew = false;
    while (priority.length && !item) {
      const p = priority.shift();
      item = data.gallery.find((g) => g.id === p.id);
      isNew = !!item;
    }
    if (!item) { item = data.gallery[idx % data.gallery.length]; idx++; }

    const layer = layers[1 - active];
    const r = item.result || {};
    const src = r.videoUrl || r.imageUrl || item.inputUrl;
    const caption = `<div class="caption"><span class="em">${esc(item.emoji || '✨')}</span><div>${esc(item.label || '')}<small>${item.type === 'drawing' ? 'Tegnet av' : 'Med'} ${esc(item.guest || 'en hemmelig gjest')}</small></div></div>`;
    const badge = isNew ? '<div class="badge-new">NYTT! 🎉</div>' : '';
    const bg = `<div class="bg" style="background-image:url('${esc(item.inputUrl || r.imageUrl || '')}')"></div>`;
    if (r.videoUrl) {
      layer.innerHTML = bg + `<video src="${esc(src)}" muted playsinline autoplay></video>` + caption + badge;
      const v = layer.querySelector('video');
      let loops = 0;
      v.addEventListener('ended', () => { loops++; if (loops >= 2 || v.duration > 8) next(); else v.play(); });
      v.addEventListener('error', () => next());
      timer = setTimeout(next, 25000); // sikring
    } else {
      layer.innerHTML = bg + `<img class="kb" src="${esc(src)}" alt="">` + caption + badge;
      timer = setTimeout(next, 9000);
    }
    layer.classList.add('on');
    layers[active].classList.remove('on');
    const old = layers[active];
    setTimeout(() => { if (!old.classList.contains('on')) old.innerHTML = ''; }, 1400);
    active = 1 - active;
  }

  // ---------------------------------------------------------------- musikk
  let started = false, current = null, fallback = false;

  let switching = false;
  async function playNext(finishedId) {
    if (!SOUND || switching) return;
    switching = true;
    let now = null;
    try {
      const r = await fetch('/api/queue/next', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ finished: finishedId || '' }) });
      now = (await r.json()).nowPlaying;
    } catch { /* prøv igjen senere */ }
    switching = false;

    if (now) {
      fallback = false;
      start(now);
    } else if (data.played.length) {
      // Køen er tom: spill tidligere sanger om igjen til noen lager en ny
      fallback = true;
      const pick = data.played[Math.floor(Math.random() * data.played.length)];
      start(pick);
    } else {
      current = null;
      fallback = false;
      renderSide();
      setTimeout(() => { if (!current) playNext(null); }, 5000);
    }
  }

  function start(song) {
    current = song;
    audio.src = song.result.audioUrl;
    audio.play().catch(() => {});
    renderSide();
  }

  audio.addEventListener('ended', () => playNext(fallback ? null : current && current.id));
  audio.addEventListener('error', () => setTimeout(() => playNext(fallback ? null : current && current.id), 1500));
  audio.addEventListener('timeupdate', () => {
    const b = document.querySelector('#now .bar div');
    if (b && audio.duration) b.style.width = (audio.currentTime / audio.duration) * 100 + '%';
  });

  // ---------------------------------------------------------------- sidepanel
  function renderSide() {
    const song = SOUND ? current : data.nowPlaying;
    const now = document.getElementById('now');
    if (song) {
      const r = song.result || {};
      now.innerHTML = `<div class="row2"><div class="cover">${r.imageUrl ? `<img src="${esc(r.imageUrl)}" alt="">` : '🎵'}</div>
        <div><div class="title"><span class="eq"><i></i><i></i><i></i></span>${esc(r.title || song.label)}</div>
        <div class="by">${fallback ? 'Reprise · ' : ''}Laget av ${esc(song.guest || 'en hemmelig gjest')}</div></div></div>
        <div class="bar"><div></div></div>`;
    } else {
      now.innerHTML = '<p class="muted">Ingen sanger ennå. Lag den første! 🎤</p>';
    }
    const q = document.getElementById('queue');
    q.innerHTML = data.queue.length
      ? data.queue.slice(0, 6).map((s, i) => `<li><b>${i + 1}</b><div>${esc((s.result && s.result.title) || s.label)}<small>fra ${esc(s.guest || 'en gjest')}</small></div></li>`).join('')
      : '<li class="muted">Tom kø. Skann og lag en sang!</li>';
    document.getElementById('working').innerHTML = data.working ? `⚙️ <b>${data.working}</b> kreasjon${data.working === 1 ? '' : 'er'} lages akkurat nå …` : '';
  }

  // ---------------------------------------------------------------- toast
  let toastTimer;
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
  }

  // ---------------------------------------------------------------- start
  document.getElementById('start').addEventListener('click', () => {
    document.getElementById('start').remove();
    started = true;
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    playNext(null);
  });

  refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
