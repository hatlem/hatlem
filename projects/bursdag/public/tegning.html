<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="preview.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<title>Tegning blir film</title>
</head>
<body data-help="tegning">
<main class="wrap">
  <div class="top"><a class="back" href="./">‹ Tilbake</a></div>
  <h1>🖍️ Tegning blir film</h1>
  <p class="hint">For både store og små, og ingen trenger å kunne tegne! Tips: Tegn bursdagsbarnet. Ta bildet rett ovenfra i godt lys, og få med hele arket.</p>

  <form id="f">
    <div class="card">
      <div class="step">1 · Ta bilde av tegningen</div>
      <label class="photo-drop" id="drop">
        <div><div class="big">📸</div><strong>Trykk for å ta bilde</strong></div>
        <input type="file" name="image" accept="image/*" capture="environment">
      </label>
      <div class="or">ingen tegning?</div>
      <div class="assist">
        <button type="button" class="primary" id="drawBtn">✏️ Tegn på mobilen</button>
        <button type="button" id="ideaBtn">💡 Gi meg en idé</button>
      </div>
      <div class="idea-box" id="ideaBox" hidden></div>
    </div>

    <div class="card">
      <div class="step">2 · Velg stil</div>
      <div id="styles"></div>
      <label for="desc">Hva har du tegnet? (valgfritt)</label>
      <textarea id="desc" name="description" maxlength="300" placeholder="F.eks. bursdagsbarnet som astronaut på månen"></textarea>
    </div>

    <div class="card" id="pvCard">
      <div class="step">👀 Slik kan det bli</div>
      <div class="pv-tabs"><button type="button" data-tab="mine" class="on">Ditt bilde</button><button type="button" data-tab="example" disabled>▶︎ Ekte eksempel</button></div>
      <div class="pv-box"></div>
    </div>
    <div class="card">
      <div class="step">3 · Hvem er kunstneren?</div>
      <input type="text" id="name" name="name" maxlength="40" placeholder="Navnet ditt" autocomplete="given-name">
    </div>

    <button class="btn" id="go" type="submit" disabled>🎬 Lag filmen!</button>
    <div class="error" id="err" role="alert"></div>
  </form>
</main>
<script src="common.js"></script>
<script src="drawpad.js"></script>
<script src="help.js"></script>
<script src="preview.js"></script>
<script>
  const form = document.getElementById('f');
  const go = document.getElementById('go');
  let file = null;
  Party.demoBanner('video');
  Party.rememberName(document.getElementById('name'));
  const pv = Party.preview(document.getElementById('pvCard'), 'drawing');
  Party.config().then((c) => {
    Party.chips(document.getElementById('styles'), 'style', c.drawingStyles);
    const sync = () => { const v = form.style.value; pv.setStyle(v, (c.drawingStyles.find((s) => s.id === v) || {}).name); };
    document.getElementById('styles').addEventListener('change', sync);
    sync();
  });
  const drop = document.getElementById('drop');
  const useFile = (f) => { file = f; go.disabled = false; pv.setImage(URL.createObjectURL(f)); };
  Party.photoPicker(drop, useFile);

  // Hjelp til de som ikke har tegnet: idé + tegn rett på mobilen
  let ideas = [], idea = '';
  Party.config().then((c) => { ideas = c.drawingIdeas || []; });
  document.getElementById('ideaBtn').addEventListener('click', () => {
    if (!ideas.length) return;
    let next = Party.pick(ideas);
    if (ideas.length > 1) while (next === idea) next = Party.pick(ideas);
    idea = next;
    const box = document.getElementById('ideaBox');
    box.hidden = false;
    box.textContent = '💡 ' + idea;
    // Bruk idéen som beskrivelse, så AI-en vet hva tegningen forestiller
    form.description.value = idea.replace(/^Tegn\s+/i, '').replace(/\s*\p{Extended_Pictographic}+\s*$/u, '');
  });
  document.getElementById('drawBtn').addEventListener('click', () => {
    Party.drawpad({
      idea,
      onDone(blob) {
        const f = new File([blob], 'tegning.png', { type: 'image/png' });
        Party.showPhoto(drop, f);
        useFile(f);
        drop.scrollIntoView({ behavior: 'smooth', block: 'center' });
      },
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!file) return;
    go.disabled = true; go.textContent = '⏳ Laster opp …';
    document.getElementById('err').textContent = '';
    try {
      const fd = new FormData();
      fd.append('image', await Party.shrinkImage(file), 'tegning.jpg');
      fd.append('style', form.style.value);
      fd.append('description', form.description.value);
      fd.append('name', form.name.value);
      fd.append('deviceId', Party.deviceId());
      const { id } = await Party.submit('api/drawing', fd);
      location.href = 'status/' + id;
    } catch (err) {
      document.getElementById('err').textContent = err.message;
      go.disabled = false; go.textContent = '🎬 Lag filmen!';
    }
  });
</script>
</body>
</html>
